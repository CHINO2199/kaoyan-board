<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>计算机组成原理刷题本 · 王道考研</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#86868b;--pri:#0071e3;--pri-lt:#e8f0fe;--succ:#34c759;--succ-lt:#e8f8ed;--dang:#ff3b30;--dang-lt:#fee8e7;--warn:#ff9500;--warn-lt:#fff3e0;--bdr:#e5e5ea;--rds:10px;--sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 16px rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px}
.hdr{background:linear-gradient(135deg,#1c1c1e,#2c2c2e);color:#fff;padding:28px 0;text-align:center}
.hdr h1{font-size:24px;font-weight:600;letter-spacing:-0.3px}.hdr p{font-size:13px;opacity:.7;margin-top:4px}
.nav{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;padding:0 6px}
.tab{flex:0 0 auto;padding:14px 18px;font-size:14px;color:var(--sub);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--text)}.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.main{padding:28px 0}.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:var(--rds);box-shadow:var(--sh);padding:24px;margin-bottom:18px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--rds);box-shadow:var(--sh);padding:14px 18px;text-align:center}
.stat .sv{font-size:26px;font-weight:700}.stat .sl{font-size:11px;color:var(--sub);margin-top:2px}
.btn{padding:9px 18px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:#005bb5}
.btn-s{background:#f0f0f5;color:var(--text)}.btn-s:hover{background:#e0e0e8}
.btn-d{background:var(--dang-lt);color:var(--dang)}.btn-d:hover{background:var(--dang);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px}.btn:disabled{opacity:.45}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbar input,.tbar select{padding:8px 10px;border:1px solid var(--bdr);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text)}
.tbar input{flex:1;min-width:180px}
.tbl-w{overflow-x:auto;background:var(--card);border-radius:var(--rds);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f0f5;font-size:13px}
th{background:#fafafa;font-weight:600;color:var(--sub);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}th .arw{margin-left:3px;opacity:.4;font-size:10px}th.sorted .arw{opacity:1;color:var(--pri)}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.bg-g{background:var(--succ-lt);color:var(--succ)}.bg-r{background:var(--dang-lt);color:var(--dang)}
.bg-y{background:#f0f0f5;color:var(--sub)}.bg-o{background:var(--warn-lt);color:var(--warn)}.bg-b{background:var(--pri-lt);color:var(--pri)}
.qcard{background:var(--card);border-radius:var(--rds);box-shadow:var(--sh2);padding:28px 32px;margin-bottom:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctag{background:var(--pri-lt);color:var(--pri);padding:3px 10px;border-radius:4px;font-size:11px}.ntag{background:#f0f0f5;color:var(--sub);padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600}
.qbar{background:#f0f0f5;border-radius:4px;height:5px;overflow:hidden;margin-bottom:16px}.qbar .qf{background:var(--pri);height:100%;transition:width .3s}
.qtext{font-size:15px;font-weight:500;line-height:1.7;margin-bottom:16px;color:var(--text);white-space:pre-wrap}
.qimage{text-align:center;margin-bottom:16px}.qimage img{max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--bdr)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:600px){.opts{grid-template-columns:1fr}}
.opt{padding:14px 16px;border:2px solid var(--bdr);border-radius:8px;cursor:pointer;transition:.12s;display:flex;gap:12px;align-items:flex-start;background:var(--card)}
.opt:hover:not(.lock){border-color:var(--pri);background:var(--pri-lt)}.opt.sel{border-color:var(--pri);background:var(--pri-lt);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.opt.ok{border-color:var(--succ);background:var(--succ-lt)}.opt.no{border-color:var(--dang);background:var(--dang-lt)}.opt.lock{cursor:not-allowed;opacity:.85}
.otl{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;background:#f0f0f5;color:var(--sub);transition:.12s}
.opt.sel .otl{background:var(--pri);color:#fff}.opt.ok .otl{background:var(--succ);color:#fff}.opt.no .otl{background:var(--dang);color:#fff}
.ott{flex:1;font-size:14px;line-height:1.55}
.slot-group{margin-bottom:14px;border:1px solid var(--bdr);border-radius:8px;padding:12px 14px;background:#fafbfc}
.slot-head{font-size:12px;font-weight:600;color:var(--pri);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.slot-num{background:var(--pri);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.slot-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.slot-opts{grid-template-columns:1fr}}.slot-opts .opt{padding:10px 12px}.slot-opts .otl{width:24px;height:24px;font-size:12px}.slot-opts .ott{font-size:13px}
.fb{padding:18px 22px;border-radius:8px;margin-bottom:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.fb.ok{border-left:4px solid var(--succ);background:var(--succ-lt)}.fb.no{border-left:4px solid var(--dang);background:var(--dang-lt)}
.fbt{font-weight:600;margin-bottom:8px;font-size:14px}.fbt.ok{color:var(--succ)}.fbt.no{color:var(--dang)}
.fbl{margin:5px 0;font-size:13px}.fbl .clr-ok{color:var(--succ);font-weight:600}.fbl .clr-no{color:var(--dang);font-weight:600}
.fbe{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.06);font-size:13px;color:var(--sub)}
.fb-memo{margin-top:8px;padding:10px 14px;background:rgba(255,149,0,.1);border-radius:6px;font-size:13px;white-space:pre-wrap}
.fb-memo .memo-title{font-weight:600;color:var(--warn);font-size:11px;margin-bottom:4px}
.fb-ref{font-size:11px;color:#999;margin-top:6px}
.fb-slot{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,.06)}
.fb-slot:last-child{border-bottom:none}.fb-slot .sn{min-width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#f0f0f5;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:14px;padding:28px;max-width:800px;width:95%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h3{font-size:20px;margin-bottom:12px}.modal .close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub)}
.settle-item{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:6px 0;border-radius:8px;background:#f9f9fb}.settle-item.wrong{background:var(--dang-lt)}.settle-item label{flex:1;font-size:13px;cursor:pointer}
.result{text-align:center;padding:20px}.result .score{font-size:52px;font-weight:700;color:var(--pri);margin:8px 0}.result .score.good{color:var(--succ)}.result .score.bad{color:var(--dang)}
.wrong-q{border-left:3px solid var(--dang);padding:12px 16px;margin:12px 0;background:#fafafa;border-radius:0 8px 8px 0}
.wrong-q .meta{font-size:11px;color:var(--sub);margin-bottom:4px}.wrong-q .qt{font-weight:500;font-size:13px;margin-bottom:6px;white-space:pre-wrap}.wrong-q .ua{color:var(--dang);font-size:12px}.wrong-q .ca{color:var(--succ);font-size:12px}
.wrong-detail{border:1px solid var(--bdr);border-left:4px solid var(--dang);border-radius:0 8px 8px 0;padding:14px 16px;margin:12px 0;background:var(--card)}
.wd-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}.wd-q{font-weight:500;font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:10px;padding:8px 12px;background:#f9f9fb;border-radius:6px}
.wd-ans{font-size:13px;margin-bottom:10px;line-height:1.7;padding:8px 12px;background:#f9f9fb;border-radius:6px}.wd-ans .ua{color:var(--dang)}.wd-ans .ca{color:var(--succ)}
.wd-actions{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.wd-memo{width:100%;font-size:12px;padding:8px 12px;min-height:38px;border:1px solid var(--bdr);border-radius:6px;background:#f9f9fb;resize:vertical;font-family:inherit}.wd-memo:focus{border-color:var(--pri);background:var(--card);outline:none}.wd-memo.has-text{border-color:var(--warn)}
.setup{text-align:center;padding:40px 20px}.setup h2{font-size:22px;margin-bottom:8px}.setup p{color:var(--sub);margin-bottom:24px}
.setup-opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.setup-opt{padding:20px 36px;border:2px solid var(--bdr);border-radius:var(--rds);cursor:pointer;background:var(--card);font-family:inherit;transition:.15s;min-width:140px}.setup-opt:hover{border-color:var(--pri);background:var(--pri-lt)}.setup-opt .n{font-size:36px;font-weight:700;color:var(--pri)}.setup-opt .d{font-size:12px;color:var(--sub);margin-top:4px}
.ch-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.ch-sel .cs{font-size:12px;padding:7px 14px;border:1px solid var(--bdr);border-radius:20px;cursor:pointer;background:var(--card);font-family:inherit;transition:.12s;color:var(--sub)}.ch-sel .cs:hover{border-color:var(--pri);color:var(--pri)}.ch-sel .cs.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.drop-zone{width:32px;height:32px;border:1px dashed var(--bdr);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;font-size:14px;position:relative;overflow:hidden}.drop-zone:hover{border-color:var(--pri);background:var(--pri-lt)}.drop-zone.has-img{border-style:solid;border-color:var(--succ)}.drop-zone img{width:100%;height:100%;object-fit:cover;border-radius:4px}.drop-zone .remove-img{position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:var(--dang);color:#fff;border-radius:50%;font-size:9px;display:none;align-items:center;justify-content:center;cursor:pointer}.drop-zone.has-img:hover .remove-img{display:flex}
.memo-inline{width:100%;min-height:26px;border:1px solid transparent;border-radius:4px;padding:2px 6px;font-size:11px;font-family:inherit;background:transparent;color:var(--sub);resize:vertical;transition:.12s}.memo-inline:hover{border-color:var(--bdr)}.memo-inline:focus{border-color:var(--pri);outline:none;background:var(--card);color:var(--text)}.memo-inline.has-text{border-color:var(--warn);color:var(--text)}
.toast{position:fixed;top:18px;right:18px;background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:300;animation:slideIn .25s}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.bulk-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bulk-row span{font-size:12px;color:var(--sub)}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}.empty .ico{font-size:42px;margin-bottom:14px;opacity:.4}
.edit-grid{display:grid;grid-template-columns:1fr;gap:12px}.edit-grid label{font-weight:600;font-size:12px;color:var(--sub);margin-bottom:-8px}
.edit-grid input,.edit-grid textarea{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text)}.edit-grid textarea{min-height:60px;resize:vertical}.edit-grid input:focus,.edit-grid textarea:focus{border-color:var(--pri);outline:none}
.edit-opts-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.edited-mark{display:inline-block;font-size:10px;background:var(--warn);color:#fff;border-radius:3px;padding:1px 5px;margin-left:4px}
.slot-hint{font-size:11px;color:var(--sub);margin-left:6px}
@media(max-width:640px){.wrap{padding:0 10px}.qcard{padding:18px}.tab{padding:12px 14px;font-size:13px}.hdr h1{font-size:20px}.stat-row{grid-template-columns:repeat(2,1fr)}.modal{padding:20px}}
/* ===== 📊 学习看板 + UI 优化（新增，仅追加不覆盖） ===== */
:root{--rds:14px}
.tab{border-radius:10px 10px 0 0}
.tab:hover{color:var(--text);background:rgba(0,0,0,.035)}
.card{transition:box-shadow .18s ease,border-color .18s ease}
.btn{transition:transform .12s ease,box-shadow .12s ease,background .15s ease,opacity .15s ease}
.btn:hover{box-shadow:var(--sh2)}
.btn:active{transform:scale(.97)}
.tbl-w table tbody tr{transition:background .12s ease}
.hdr{padding:26px 0}
.hdr h1{font-size:25px;letter-spacing:.6px}
.hdr p{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:4px}
/* 看板通用 */
.dash-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.dh-hi{font-size:19px;font-weight:800}
.dh-sub{font-size:12.5px;color:var(--sub);margin-top:5px}
.dh-badge{font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-lt);padding:7px 15px;border-radius:999px;white-space:nowrap}
.dash-grid{display:grid;grid-template-columns:1.28fr 1fr;gap:16px;align-items:start}
.dash-grid>.card,.dash-grid>div>.card{margin-bottom:16px}
.dash-h3{font-size:14px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dash-h3 .hint{font-size:11px;color:var(--sub);font-weight:400}
/* 章节掌握 */
.chp{margin-bottom:13px}
.chp:last-child{margin-bottom:0}
.chp-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px}
.chp-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chp-cnt{color:var(--sub);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
.chp-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#eef0f3}
.chp-bar i{display:block;height:100%}
.chp-bar i.mas{background:var(--succ)}
.chp-bar i.mid{background:var(--warn)}
.chp-bar i.bad{background:var(--dang)}
.dash-legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);flex-wrap:wrap;margin-top:12px}
.dash-legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
/* 热力图 */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:6px}
.heat i{display:block;width:11px;height:11px;border-radius:3px;background:#eef0f3}
.heat i.l1{background:#cdeccf}
.heat i.l2{background:#8ddb9b}
.heat i.l3{background:#34c759}
.heat i.l4{background:#1c8a3c}
.heat-foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin-top:8px}
.heat-foot i{width:11px;height:11px;border-radius:3px;background:#eef0f3;display:block}
/* 任务甘特 */
.gantt-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--sub);margin-bottom:6px;text-align:center}
.gantt-row{position:relative;height:30px;border-radius:9px;background:#f5f7fa;margin-bottom:6px}
.gantt-row .gtask{position:absolute;top:3px;height:24px;line-height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--pri);box-shadow:0 1px 4px rgba(0,113,227,.28)}
.gantt-row .gtask:hover{filter:brightness(1.08)}
.gantt-row .gtask.c2{background:#7a5af8}
.gantt-row .gtask.c3{background:#f59f0b}
.gantt-row .gtask.c4{background:#e5484d}
.gantt-row .gtask.c5{background:#12a594}
.task-add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.task-add input{padding:7px 10px;border:1px solid var(--bdr);border-radius:8px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--text)}
.task-add input[type=text]{flex:1;min-width:110px}
.task-add button{padding:8px 15px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;font-size:12.5px;font-family:inherit}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav button{border:1px solid var(--bdr);background:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--sub)}
.week-nav button:hover{color:var(--pri);border-color:var(--pri)}
/* 掌握分布 */
.dist-item{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--bdr)}
.dist-item:last-child{border-bottom:0}
.dist-item .dv{font-weight:800;font-variant-numeric:tabular-nums}
@media(max-width:860px){.dash-grid{grid-template-columns:1fr}}


</style>
</head>
<body>
<div class="hdr"><div class="wrap"><h1>⚙️ 计算机组成原理刷题本</h1><p>2027 王道考研 · 共 604 题 · 第1~7章</p></div></div>
<div class="nav" id="tabs">
  <button class="tab on" data-tab="dash">📊 学习看板</button>
  <button class="tab" data-tab="all">📖 全部题库</button>
  <button class="tab" data-tab="book">📌 我的错题本</button>
  <button class="tab" data-tab="chapter">📚 章节顺序刷题</button>
  <button class="tab" data-tab="random">🎲 随机刷题</button>
  <button class="tab" data-tab="exam">📝 组卷测试</button>
  <span id="gdot" title="未配置 Token，点击设置" style="cursor:pointer;font-size:14px;margin-left:12px;user-select:none;vertical-align:middle;flex:none;line-height:38px;">⚪</span>
</div>
<div class="main"><div class="wrap">

<div class="view on" id="v-dash">
  <div class="card dash-hero">
    <div>
      <div class="dh-hi" id="dh-hi">欢迎回来 👋</div>
      <div class="dh-sub" id="dh-sub">正在加载学习数据…</div>
    </div>
    <div class="dh-badge" id="dh-badge">🔥 连续学习 0 天</div>
  </div>
  <div class="stat-row" id="dash-stats"></div>
  <div class="dash-grid">
    <div>
      <div class="card">
        <div class="dash-h3">📈 章节掌握进度 <span class="hint">按作答正确率自动归类</span></div>
        <div id="dash-chap"></div>
        <div class="dash-legend">
          <span><b style="background:var(--succ)"></b>掌握（全对）</span>
          <span><b style="background:var(--warn)"></b>不稳（错率≤50%）</span>
          <span><b style="background:var(--dang)"></b>不会（错率&gt;50%）</span>
          <span><b style="background:#eef0f3"></b>未作答</span>
        </div>
      </div>

3.5 高速缓冲存储器", "chapter_num": "", "number": 2, "type": "choice", "question": "访问 Cache 系统失效时,通常不仅主存向 CPU 传送信息,同时还需要将信息写入 Cache,在此过程中传送和写入信息的数据宽度各为( )", "options": {"A": "块、页", "B": "字、字", "C": "字、块", "D": "块、块"}, "answer": "C", "explanation": ""}, {"id": "3.5-03", "chapter": "3.5 高速缓冲存储器", "section": "3.5 高速缓冲存储器", "chapter_num": "", "number": 3, "type": "choice", "question": "假定用作 Cache 的 SRAM 的存取时间为 2ns, 用作主存的 SDRAM 的存取时间为 40ns。为使存储系统的平均存取时间达到 3ns, 则 Cache 命中率应达到 ( ) 左右。", "options": {"A": "92.5%", "B": "85%", "C": "97.5%", "D": "99.9%"}, "answer": "C", "explanation": ""}, {"id": "3.5-04", "chapter": "3.5 高速缓冲存储器", "section": "3.5 高速缓冲存储器", "chapter_num": "", "number": 4, "type": "choice", "question": "关于 Cache 的更新策略, 下列说法中正确的是 ( )", "options": {"A": "读操作时, 全写法和回写法在命中时应用", "B": "写操作时, 回写法和写分配法在命中时应用", "C": "读操作时, 全写法和写分配法在失效时应用", "D": "写操作时, 写分配法、非写分配法在失效时应用"}, "answer": "D", "explanation": ""}, {"id": "3.5-05", "chapter": "3.5 高速缓冲存储器", "section": "3.5 高速缓冲存储器", "chapter_num": "", "number": 5, "type": "choice", "question": "在不同的情况下,需要采用适合的 Cache 写策略。对于下面两种情况: ①主要运行访问密集型应用, 其中包含写操作; ②安全性要求很高, 不允许有任何数据不一致的情况发生。适合它们的写策略分别是( )", "options": {"A": "回写法, 全写法", "B": "全写法, 回写法", "C": "回写法, 回写法", "D": "全写法, 全写法"}, "answer": "A", "explanation": ""}, {"id": "3.5-06", "chapter": "3.5 高速缓冲存储器", "section": "3.5 高速缓冲存储器", "chapter_num": "", "number": 6, "type": "choice", "question": "局部性通常有两种不同的形式: 时间局部性和空间局部性。程序员是否编写出高速缓存友好的代码, 就取决于这两方面的问题。对于下面这个函数, 说法正确的是 ( )", "options": {"A": "对于变量 i 和 sum, 循环体具有良好的空间局部性", "B": "对于变量 i、sum 和 v[N], 循环体具有良好的空间局部性", "C": "对于变量 i 和 sum, 循环体具有良好的时间局部性", "D": "对于变量 i、sum 和 v[N], 循环体具有良好的时间局部性"}, "answer": "C", "explanation": ""}, {"id": "3.5-07", "chapter": "3.5 高速缓冲存储器", "section": "3.5 高速缓冲存储器", "chapter_num": "", "number": 7, "type": "choice", "question": "对于下列代码, 以下哪种变化将使其具有更好的空间局部性 ( )\nint i, j, k, sum=0;\nfor(i=0; i<n; i++)\nfor(j=0; j<n; j++)\nfor(k=0; k<n; k++)\nsum+=a[k][j][i];", "options": {"A": "将第2行与第3行互换", "B": "将第2行与第4行互换", "C": "将第5 ": "【2021 统考真题】异常事件在当前指令执行过程中进行检测,中断请求则在当前指令执行后进行检测。下列事件中,相应处理程序执行后,必须回到当前指令重新执行的是( )", "options": {"A": "系统调用", "B": "页缺失", "C": "DMA 传送结束", "D": "打印机缺纸"}, "answer": "B", "explanation": ""}, {"id": "5.6-01", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 1, "type": "choice", "question": "下列关于流水线 CPU 的叙述中, 正确的是 ( )", "options": {"A": "流水线技术通过复制多个功能部件实现空间并行处理", "B": "只有精简指令集 (RISC) 处理器才能采用流水线技术", "C": "流水线 CPU 必须采用多核结构才能工作", "D": "流水线是一种通过时间并行性提高指令执行效率的技术"}, "answer": "D", "explanation": ""}, {"id": "5.6-02", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 2, "type": "choice", "question": "流水段 CPU 是由一系列称为 “段” 的处理电路组成的。一个 m 段流水线稳定时的 CPU 的吞吐能力, 与 m 个并行部件的 CPU 的吞吐能力相比, ( )", "options": {"A": "具有同等水平的吞吐能力", "B": "不具备同等水平的吞吐能力", "C": "吞吐能力大于前者的吞吐能力", "D": "吞吐能力小于前者的吞吐能力"}, "answer": "A", "explanation": ""}, {"id": "5.6-03", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 3, "type": "choice", "question": "设指令由取指、分析、执行 3 个子部件完成, 并且每个子部件的时间均为 Delta t , 若采用常规标量单流水线处理机 (即处理机的度为 1), 连续执行 12 条指令, 共需 ( )", "options": {"A": "12 Delta t", "B": "14 Delta t", "C": "16 Delta t", "D": "18 Delta t"}, "answer": "B", "explanation": ""}, {"id": "5.6-04", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 4, "type": "choice", "question": "设指令由取指、分析、执行 3 个子部件完成, 并且每个子部件的时间均为 Delta t , 若采用度为 4 的超标量流水线处理机, 连续执行 20 条指令, 只需 ( )", "options": {"A": "3 Delta t", "B": "5 Delta t", "C": "7 Delta t", "D": "9 Delta t"}, "answer": "C", "explanation": ""}, {"id": "5.6-05", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 5, "type": "choice", "question": "设指令流水线把一条指令分为取指、分析、执行3部分,且3部分的时间分别是 t_{text{取指}} = 2 mathrm{~ns} , t_{text{分析}} = 2 mathrm{~ns} , t_{text{执行}} = 1 mathrm{~ns} , 则100条指令全部执行完毕需( )", "options": {"A": "163ns", "B": "183ns", "C": "193ns", "D": "203ns"}, "answer": "D", "explanation": ""}, {"id": "5.6-06", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 6, "type": "choice", "question": "下列关于指令流水线设计的叙述中, 错误的是( )", "options": {"A": "指令执行过程中的各个子功能都需要包含在某个流水段中", "B": "所有子功能都必须按一定的顺序经过流水段", "C": "虽然各子功能所用实际时间可能不同, 但经过每个流水段的时间都一样", "D": "任何时候各个流水段的功能部件都不可能执行空操作"}, "answer": "D", "explanation": ""}, {"id": "5.6-07", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 7, "type": "choice", "question": "下列关于流水段寄存器的叙述中, 正确的是 ( )", "options": {"A": "指令译码得到的控制信号需通过流水段寄存器传递到下一个流水段", "B": "每个流水段之间的流水段寄存器位数一定相同", "C": "每个流水段之间的流水段寄存器存放的信息一定相同", "D": "用户程序可以通过指令指定访问哪个流水段寄存器"}, "answer": "A", "explanation": ""}, {"id": "5.6-08", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 8, "type": "choice", "question": "下列关于流水线数据通路的描述中, 错误的是 ( )", "options": {"A": "每个流水段由执行指令子功能的功能部件和流水段寄存器组成", "B": "控制信号仅作用在功能部件上, 时钟信号仅作用在流水段寄存器上", "C": "在没有阻塞的情况下, PC 的值在每个时钟周期都会改变", "D": "取指令阶段和指令译码阶段不需要控制信号的控制"}, "answer": "B", "explanation": ""}, {"id": "5.6-09", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 9, "type": "choice", "question": "下列关于结构冒险的叙述中, 正确的是 ( )\nI. 结构冒险是指多条指令在同一时钟周期争用同一个硬件资源\nII. 规定每条指令只能在指定流水段访问特定功能部件，可减少结构冒险\nIII. 通过重复设置功能部件 (如多个 ALU) 可以避免结构冒险\nIV. 将数据 Cache 与指令 Cache 分离，可解决取指和取数同时访存引起的结构冒险", "options": {"A": "I、II、IV", "B": "I、II、III", "C": "I、III、IV", "D": "I、II、III 和 IV"}, "answer": "D", "explanation": ""}, {"id": "5.6-10", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 10, "type": "choice", "question": "指令流水线中出现数据相关时流水线将受阻, ( ) 可部分解决数据相关问题。", "options": {"A": "增加硬件资源", "B": "采用旁路技术", "C": "采用分支预测技术", "D": "以上都可以"}, "answer": "B", "explanation": ""}, {"id": "5.6-11", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 11, "type": "choice", "question": "下列关于数据冒险和转发技术的叙述中, 正确的是( )\nI. 并非所有数据冒险都能通过转发技术解决\nII. 五段流水线中 load-use 数据冒险会引起至少一个时钟周期的阻塞\nIII. 前面的分支指令和后面的 ALU 运算指令之间肯定不会发生数据冒险", "options": {"A": "I、II", "B": "I、III", "C": "II、III", "D": "I、II、III"}, "answer": "A", "explanation": ""}, {"id": "5.6-12", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 12, "type": "choice", "question": "下列关于数据冒险的叙述中, 正确的是( )\nI. 数据冒险是指后面指令用到的数据还未来得及由前面的指令产生\nII. 在发生数据冒险的指令之间插入空操作指令能避免数据冒险\nIII. 采用转发 (旁路) 技术可以解决一部分数据冒险现象\nIV. 通过编译器调整指令顺序可解决部分数据冒险", "options": {"A": "I、II、IV", "B": "I、II、III", "C": "I、III、IV", "D": "I、II、III 和 IV"}, "answer": "D", "explanation": ""}, {"id": "5.6-13", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 13, "type": "choice", "question": "下列指令序列中, 指令 I1 和 I3、I2 和 I3 之间发生数据相关。假定采用 “取指、译码/取数、执行、访存、写回” 五段流水线方式, 那么在采用转发技术时, 需要在指令 I3 之前加入 ( ) 条空操作指令才能使这段程序不发生数据冒险。\nI1: add r1, r0, 1 #(r1) ← (r0) + 1\nI2: load r3, 12(r2) #(r3) ← M[(r2) + 12]\nI3: add r5, r3, r1 #(r5) ← (r3) + (r1)", "options": {"A": "3", "B": "2", "C": "0", "D": "1"}, "answer": "D", "explanation": ""}, {"id": "5.6-14", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 14, "type": "choice", "question": "下面有关控制冒险的描述中, 错误的是( )\nI. 无条件转移指令不会发生控制冒险\nII. 在分支指令加入若干空操作可以避免控制冒险\nIII. 采用转发 (旁路) 技术, 可以解决部分控制冒险\nIV. 中断或异常也会引起控制冒险\nV. 流水段的数量与控制冒险引发的开销无关", "options": {"A": "I、IV、V", "B": "III、V", "C": "I、III、IV", "D": "I、III、V"}, "answer": "D", "explanation": ""}, {"id": "5.6-15", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 15, "type": "choice", "question": "下列关于分支预测的叙述中, 正确的是( )\nI. 分支预测技术可用于处理控制冒险和数据冒险\nII. 使用静态预测技术时, 每次的预测结果是一样的\nIII. 动态预测技术通常比静态预测技术的预测成功率高\nIV. 若预测错误, 已被错误放入流水线执行的指令必须被舍弃", "options": {"A": "I、II、III", "B": "I、II、IV", "C": "II、III、IV", "D": "I、II、III、IV"}, "answer": "C", "explanation": ""}, {"id": "5.6-16", "chapter": "5.6 指令流水线", "section": "5.6 指令流水线", "chapter_num": "", "number": 16, "type": "choice", "question": "下列关于指令流水线和指令执行效率的叙述中, 错误的是( )", "options": {"A": "加倍增加流水段个数不能成倍提高指令执行效率", "B": "为了提高指令吞吐率, 流水段个数应无限制地增加", "C": "增加流水段个数, 可以提高处理器的时钟频率", "D": "随着流水段个数的增加, 流水段之间缓存开销的比例增大"}, "answer": "B", "explanation": ""}, {"id": "5.6-17",     var o=null;try{o=JSON.parse(content);}catch(e){return null;}
    if(!o||typeof o!=='object'||Array.isArray(o))return null;
    if('updatedAt' in o)return o;
    return {updatedAt:0,rc:o,ed:{}}; // 兼容旧格式（纯 rc 对象）
  }
  // ---- 拉取：云端较新则完全覆盖本地 ----
  function G_pull(){
    if(!cfg.gist||!cfg.token){if(!cfg.token)setDot('⚪','未配置 Token，点击设置');return Promise.resolve(null);}
    if(busy)return Promise.resolve(null);busy=true;
    setDot('🟡','同步中…');
    return api('https://api.github.com/gists/'+cfg.gist,'GET')
      .then(function(r){if(!r.ok)throw new Error('拉取失败 HTTP '+r.status);return r.json();})
      .then(function(g){
        var fn=pickFile(g);
        if(!fn){
          /* 修复：云端还没有本科目的文件。本地有进度就上传建立，没有就静默等待，绝不拉别科数据 */
          if((getMeta().updatedAt||0)>0){setDot('🟡','上传中…');return _push(cfg.file);}
          setDot('🟢','已同步 '+new Date().toLocaleTimeString());return null;
        }
        cfg.file=fn;saveCfg();
        var cloud=parseCloud(g.files[fn].content);
        if(!cloud){setDot('🟢','已同步 '+new Date().toLocaleTimeString());return null;}
        /* 修复：云端数据若标注了别的科目，直接跳过，绝不覆盖本地 */
        if(cloud.sk&&cloud.sk!==SK){setDot('🔴','云端文件非本科目数据，已跳过');return null;}
        var cAt=cloud.updatedAt||0,lAt=getMeta().updatedAt||0;
        if(cAt>lAt){
          // 云端最新 → 直接完全覆盖本地（Timestamp-First）
          if(_rawSS)_rawSS((cloud.rc&&typeof cloud.rc==='object')?cloud.rc:{});
          if(cloud.ed&&typeof cloud.ed==='object'){try{localStorage.setItem(EK,JSON.stringify(cloud.ed));}catch(e){}}
          setMetaAt(cAt);
          lastPull=Date.now();
          setDot('🟢','已同步 '+new Date().toLocaleTimeString());
          if(typeof RAL==='function'){try{RAL();}catch(e){}}
          return {mode:'pull'};
        }else if(lAt>cAt){
          // 本地最新 → 上传覆盖云端（原实现因 busy 锁被吞掉，这里改用 _push）
          setDot('🟡','上传中…');
          return _push(cfg.file);
        }
        setDot('🟢','已同步 '+new Date().toLocaleTimeString());
        return null;
      })
      .catch(function(e){setDot('🔴',String((e&&e.message)||e));return null;})
      .then(function(v){busy=false;return v;});
  }
  // ---- 上传核心（不带 busy 锁，供拉取流程内部复用）----
  function _push(fn){
    var payload={files:{}};
    payload.files[fn]={content:JSON.stringify(buildState())};
    return api('https://api.github.com/gists/'+cfg.gist,'PATCH',payload)
      .then(function(r){if(!r.ok)throw new Error('上传失败 HTTP '+r.status);return r.json();})
      .then(function(){setDot('🟢','已同步 '+new Date().toLocaleTimeString());return true;})
      .catch(function(e){setDot('🔴',String((e&&e.message)||e));return null;});
  }
  // ---- 上传：本地状态覆盖云端 ----
  function G_push(){
    if(!cfg.gist||!cfg.token){if(!cfg.token)setDot('⚪','未配置 Token，点击设置');return Promise.resolve(null);}
    if(busy)return Promise.resolve(null);busy=true;
    setDot('🟡','上传中…');
    /*
     * 修复：只写本科目自己的文件（cfg.file 已在加载时强制为 SK 前缀）。
     * 原实现在文件名为空时会 GET 云端并“随便挑一个 json 文件”上传，
     * 这是三科数据互相覆盖的另一条路径，一并去掉。
     */
    return _push(cfg.file||(SK+'.json'))
      .then(function(v){busy=false;return v;})
      .catch(function(e){busy=false;setDot('🔴',String((e&&e.message)||e));return null;});
  }
  function G_schedule(){if(!cfg.gist||!cfg.token)return;clearTimeout(timer);timer=setTimeout(G_push,3000);}
  function G_force(){if(!cfg.gist||!cfg.token)return;clearTimeout(timer);G_push();}
  // 任何本地写库：更新时间戳 + 防抖上传（原有保存逻辑完全不变）
  function touch(){setMetaAt(Date.now());G_schedule();}
  if(!window.__G_SS_PATCHED__){
    window.__G_SS_PATCHED__=true;
    _rawSS=(typeof SS==='function')?SS:null;
    window.SS=function(s){if(_rawSS)_rawSS(s);else{try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}touch();};
  }
  // 清空刷题记录：现有 rst-btn 点击（confirm 通过后 SK 被删除）→ 打最新时间戳 + 立即上传空状态
  function hookReset(){
    var btn=document.getElementById('rst-btn');
    if(btn&&!btn.__gistHooked){
      btn.__gistHooked=true;
      btn.addEventListener('click',function(){
        setTimeout(function(){
          if(!localStorage.getItem(SK)){
            setMetaAt(Date.now());
            G_force();
          }
        },0);
      });
    }
  }
  // ---- UI ----
  function ensureUI(){
    if(!dot){
      var tabs=document.getElementById('tabs');
      if(tabs){
        var sp=document.createElement('span');
        sp.id='gdot';sp.title='未配置 Token，点击设置';
        sp.style.cssText='cursor:pointer;font-size:14px;margin-left:12px;user-select:none;vertical-align:middle;flex:none;line-height:38px;';
        sp.textContent='⚪';
        tabs.appendChild(sp);
        dot=sp;
      }
    }
    var div=document.getElementById('gset');
    if(div&&!div.__bound){
      div.__bound=true;
      var mask=document.getElementById('gmask');
      function show(){
        document.getElementById('g-token').value=cfg.token;
        document.getElementById('g-gist').value=cfg.gist;
        document.getElementById('g-file').value=cfg.file||'';
        document.getElementById('g-msg').textContent='';
        div.style.display='block';if(mask)mask.style.display='block';
      }
      function hide(){div.style.display='none';if(mask)mask.style.display='none';}
      if(dot)dot.onclick=show;
      if(mask)mask.onclick=hide;
      var c=document.getElementById('g-close');if(c)c.onclick=hide;
      var s=document.getElementById('g-save');
      if(s)s.onclick=function(){
        cfg.token=document.getElementById('g-token').value.trim();
        cfg.gist=document.getElementById('g-gist').value.trim()||'';
        /* 修复：本科目的云端文件名必须以科目代号开头，避免三科互相覆盖 */
        var _f=document.getElementById('g-file').value.trim();
        if(!(_f&&_f.indexOf(SK)===0))_f=SK+'.json';
        cfg.file=_f;
        saveCfg();
        var msg=document.getElementById('g-msg');
        if(!cfg.token){msg.textContent='请先填写 GitHub Token（状态点⚪点击配置）';setDot('⚪','未配置 Token，点击设置');return;}
        msg.textContent='已保存，正在同步…';
        setDot('🟡','同步中…');
        G_pull().then(function(){return G_push();}).then(function(v){
          if(v){setDot('🟢','已同步 '+new Date().toLocaleTimeString());msg.textContent='✓ 同步完成';}
          else{msg.textContent='✓ 同步完成（无变化）';}
        });
      };
    }
  }
  function init(){
    ensureUI();hookReset();
    if(document.readyState==='complete'||document.readyState==='interactive'){G_pull();}
    else{window.addEventListener('load',G_pull);}
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'){if(Date.now()-lastPull>60000)G_pull();}
      else{G_force();}
    });
    window.addEventListener('pagehide',function(){G_force();});
  }
  if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
})();

// ===== 📊 学习看板（新增模块，独立运行，不影响原有功能）=====
function D2(n){return (n<10?'0':'')+n;}
function DFMT(d){return d.getFullYear()+'-'+D2(d.getMonth()+1)+'-'+D2(d.getDate());}
function DJ(k,def){try{var r=localStorage.getItem(k);return r?JSON.parse(r):def;}catch(e){return def;}}
function DJset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function dLogKey(){return SK+'_log';}
function dTaskKey(){return SK+'_tasks';}
function dStat(){
  var s=LS(),o={tot:QS.length,done:0,aSum:0,wSum:0,book:0,mas:0,mid:0,bad:0,none:0};
  QS.forEach(function(q){
    var r=s[q.id];
    if(r&&r.b)o.book++;
    if(r&&r.a>0){
      o.done++;o.aSum+=r.a;o.wSum+=r.w;
      var rate=r.w/r.a;
      if(r.w===0)o.mas++;else if(rate<=0.5)o.mid++;else o.bad++;
    }else o.none++;
  });
  o.acc=o.aSum?Math.round((o.aSum-o.wSum)/o.aSum*100):null;
  o.pct=o.tot?Math.round(o.done/o.tot*100):0;
  return o;
}
function dStreak(){
  var L=DJ(dLogKey(),{}),n=0,d=new Date();
  for(var i=0;i<400;i++){
    var k=DFMT(d);
    if(L[k]&&L[k].n>0){n++;d.setDate(d.getDate()-1);}else break;
  }
  return n;
}
function dDaysLeft(){return Math.ceil((new Date(2026,11,19,8,30,0)-new Date())/86400000);}
function dChapHTML(){
  var s=LS(),map={},ks;
  QS.forEach(function(q){
    var k=q.section||'未分类';
    if(!map[k])map[k]={tot:0,mas:0,mid:0,bad:0};
    map[k].tot++;
    var r=s[q.id];
    if(r&&r.a>0){var rate=r.w/r.a;if(r.w===0)map[k].mas++;else if(rate<=0.5)map[k].mid++;else map[k].bad++;}
  });
  ks=Object.keys(map);
  if(!ks.length)return '<p style="color:var(--sub);font-size:12.5px">暂无章节数据</p>';
  return ks.map(function(k){
    var c=map[k],done=c.mas+c.mid+c.bad,p=function(v){return (v/c.tot*100)+'%';};
    return '<div class="chp"><div class="chp-top"><span class="chp-name" title="'+h(k)+'">'+h(k)+'</span>'+
      '<span class="chp-cnt">'+(done?('掌握 '+c.mas+' · 不稳 '+c.mid+' · 不会 '+c.bad):'未开始')+' ｜ '+done+'/'+c.tot+'</span></div>'+
      '<div class="chp-bar">'+(c.mas?'<i class="mas" style="width:'+p(c.mas)+'"></i>':'')+
      (c.mid?'<i class="mid" style="width:'+p(c.mid)+'"></i>':'')+
      (c.bad?'<i class="bad" style="width:'+p(c.bad)+'"></i>':'')+'</div></div>';
  }).join('');
}
function dHeatHTML(){
  var L=DJ(dLogKey(),{}),today=new Date(),html='',i;
  var start=new Date(today);start.setDate(start.getDate()-55);
  for(i=0;i<56;i++){
    var d=new Date(start);d.setDate(d.getDate()+i);
    var k=DFMT(d),r=L[k]||{n:0,w:0};
    var lv=r.n===0?0:(r.n<=3?1:(r.n<=10?2:(r.n<=25?3:4)));
    html+='<i class="l'+lv+'" title="'+k+'：'+r.n+' 题 · 错 '+r.w+' 题"></i>';
  }
  return html;
}
var dWkOff=0;
function dWeekStart(off){
  var d=new Date();d.setHours(0,0,0,0);
  var dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow+off*7);
  return d;
}
function dGanttHTML(){
  var ws=dWeekStart(dWkOff),days=[],i;
  for(i=0;i<7;i++){var d=new Date(ws);d.setDate(d.getDate()+i);days.push(d);}
  var head='<div class="gantt-head">'+days.map(function(d,i2){
    var isToday=DFMT(d)===DFMT(new Date());
    return '<span'+(isToday?' style="color:var(--pri);font-weight:800"':'')+'>周'+['日','一','二','三','四','五','六'][d.getDay()]+'<br>'+(d.getMonth()+1)+'/'+d.getDate()+'</span>';
  }).join('')+'</div>';
  var tasks=DJ(dTaskKey(),[]);
  var we=new Date(ws);we.setDate(we.getDate()+7);
  var rows=tasks.filter(function(t){
    var s=new Date(t.s+'T00:00:00'),e=new Date(t.e+'T00:00:00');
    return e>=ws&&s<we;
  }).map(function(t){
    var s=new Date(t.s+'T00:00:00'),e=new Date(t.e+'T00:00:00');
    var st=s<ws?ws:s,en=e>new Date(we-86400000)?new Date(we-86400000):e;
    var c1=Math.round((st-ws)/86400000),c2=Math.round((en-ws)/86400000)+1;
    var left=c1/7*100,width=(c2-c1)/7*100;
    return '<div class="gantt-row"><div class="gtask c'+((t.c||1))+'" style="left:'+left+'%;width:calc('+width+'% - 6px)" data-tid="'+t.id+'" title="'+h(t.s)+' ~ '+h(t.e)+'（点击可删除）">'+h(t.name)+'</div></div>';
  }).join('');
  var add='<div class="task-add"><input type="text" id="tk-name" placeholder="添加任务，如：数学二轮刷题">'+
    '<input type="date" id="tk-s" value="'+DFMT(ws)+'"><input type="date" id="tk-e" value="'+DFMT(new Date(we-86400000))+'">'+
    '<button onclick="dAddTask()">+ 添加任务</button></div>';
  return head+(rows||'<div style="color:var(--sub);font-size:12.5px;padding:2px 0 8px">本周暂无任务，在下方添加 👇</div>')+add;
}
function dAddTask(){
  var n=document.getElementById('tk-name'),s=document.getElementById('tk-s'),e=document.getElementById('tk-e');
  var name=(n&&n.value||'').trim();
  if(!name){toast('请输入任务名称');return;}
  var tasks=DJ(dTaskKey(),[]);
  var ws=dWeekStart(dWkOff),we=new Date(ws);we.setDate(we.getDate()+6);
  var sv=(s&&s.value)||DFMT(ws),ev=(e&&e.value)||DFMT(we);
  if(ev<sv)ev=sv;
  tasks.push({id:'t'+Date.now(),name:name,s:sv,e:ev,c:(tasks.length%5)+1});
  DJset(dTaskKey(),tasks);
  if(n)n.value='';
  RDASH();toast('已添加任务');
}
function dDelTask(id){
  var tasks=DJ(dTaskKey(),[]).filter(function(t){return t.id!==id;});
  DJset(dTaskKey(),tasks);RDASH();toast('已删除任务');
}
function dBindTask(){
  var box=document.getElementById('dash-gantt');
  if(box&&!box.__bound){
    box.__bound=1;
    box.addEventListener('click',function(ev){
      var t=ev.target,el=null;
      while(t&&t!==box){if(t.classList&&t.classList.contains('gtask')){el=t;break;}t=t.parentNode;}
      if(el&&el.dataset.tid&&confirm('删除任务「'+el.textContent+'」？'))dDelTask(el.dataset.tid);
    });
  }
  var p=document.getElementById('wk-prev');if(p)p.onclick=function(){dWkOff--;RDASH();};
  var nx=document.getElementById('wk-next');if(nx)nx.onclick=function(){dWkOff++;RDASH();};
  var td=document.getElementById('wk-today');if(td)td.onclick=function(){dWkOff=0;RDASH();};
}
function RDASH(){
  try{
    var o=dStat(),sl=dDaysLeft(),st=dStreak();
    var hi=document.getElementById('dh-hi'),sub=document.getElementById('dh-sub'),bd=document.getElementById('dh-badge');
    if(hi)hi.textContent='欢迎回来 👋';
    if(sub){
      var now=new Date();
      sub.textContent='今天是 '+now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月 '+now.getDate()+' 日 星期'+
        ['日','一','二','三','四','五','六'][now.getDay()]+
        (sl>0?(' ｜ 距 2026.12.19 初试还有 '+sl+' 天'):' ｜ 考试已开始，稳住！');
    }
    if(bd)bd.textContent='🔥 连续学习 '+st+' 天';
    var sb=document.getElementById('dash-stats');
    if(sb){
      var cards=[
        ['已刷题数',o.done+' <em style="font-size:13px;font-style:normal;color:var(--sub)">/ '+o.tot+'</em>','完成度 '+o.pct+'%','var(--pri)'],
        ['平均正确率',(o.acc===null?'—':o.acc+'%'),'基于 '+o.aSum+' 次作答','var(--succ)'],
        ['错题本',o.book+' 题','可在「我的错题本」查看','var(--warn)'],
        ['累计错题',o.wSum+' 次','掌握 '+o.mas+' 题 ｜ 未答 '+o.none+' 题','var(--dang)']
      ];
      sb.innerHTML=cards.map(function(x){
        return '<div class="card" style="margin:0;padding:16px 18px"><div style="font-size:11.5px;color:var(--sub);font-weight:600">'+x[0]+'</div>'+
          '<div style="font-size:25px;font-weight:800;margin-top:2px;color:'+x[3]+'">'+x[1]+'</div>'+
          '<div style="font-size:11px;color:var(--sub);margin-top:2px">'+x[2]+'</div></div>';
      }).join('');
    }
    var ch=document.getElementById('dash-chap');if(ch)ch.innerHTML=dChapHTML();
    var he=document.getElementById('dash-heat');if(he)he.innerHTML=dHeatHTML();
    var ga=document.getElementById('dash-gantt');if(ga)ga.innerHTML=dGanttHTML();
    var di=document.getElementById('dash-dist');
    if(di){
      var tot=o.tot||1;
      di.innerHTML=[['✅ 掌握','mas',o.mas,'var(--succ)'],['🟡 不稳','mid',o.mid,'var(--warn)'],['🔴 不会','bad',o.bad,'var(--dang)'],['⚪ 未作答','none',o.none,'#c7c7cc']]
        .map(function(x){
          var pc=Math.round(x[2]/tot*100);
          return '<div class="dist-item"><span>'+x[0]+'</span><span><b class="dv" style="color:'+x[3]+'">'+x[2]+'</b> <span style="color:var(--sub);font-size:11px">'+pc+'%</span></span></div>';
        }).join('');
    }
    dBindTask();
  }catch(e){if(window.console)console.log('RDASH:',e);}
}
// 记录每日刷题活动（包装 REC，原逻辑不变）
(function(){
  if(window.__DASH_LOG__)return;window.__DASH_LOG__=true;
  if(typeof REC!=='function')return;
  var _rec=REC;
  window.REC=function(id,ok){
    _rec(id,ok);
    try{
      var key=SK+'_log',L=DJ(key,{}),k=DFMT(new Date());
      if(!L[k])L[k]={n:0,w:0};
      L[k].n++;if(!ok)L[k].w++;
      var ks=Object.keys(L);
      if(ks.length>150){ks.sort();while(ks.length>150){delete L[ks.shift()];}}
      DJset(key,L);
    }catch(e){}
  };
})();
window.RDASH=RDASH;window.dAddTask=dAddTask;window.dDelTask=dDelTask;
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(RDASH,0);});}
else{setTimeout(RDASH,0);}
</script>
