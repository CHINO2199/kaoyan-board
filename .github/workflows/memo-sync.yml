name: 墨墨进度自动同步

# 调度说明（GitHub Actions 的 cron 一律用 UTC 时间，北京时间 = UTC + 8）
#   - '0 */4 * * *'  → 每 4 小时：北京 0 / 4 / 8 / 12 / 16 / 20 点
#   - '30 18 * * *'  → 北京 02:30
#
# 关于 02:30 这一班：墨墨的「学习日」以凌晨 4 点为界（0:00~4:00 背的算前一天），
# 脚本已按此规则把数据归到正确的日期。之所以不设在 3:30 之后，是为了给 GitHub
# 定时任务的延迟（常见几分钟，偶尔十几分钟）留出余量，避免跨过 4 点导致归错日期。
on:
  schedule:
    - cron: '0 */4 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:        # 也可以在 Actions 页面手动点一次立即运行

# 允许把更新后的 data.enc 提交回仓库
permissions:
  contents: write

# 避免多次调度撞车
concurrency:
  group: memo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet pycryptodome

      - name: 抓取墨墨进度并写回 data.enc
        env:
          KAOYAN_KEY: ${{ secrets.KAOYAN_KEY }}
          MAIMEMO_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
        run: python tools/memo_sync.py

      - name: 提交变更
        run: |
          git config user.name  "memo-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.enc
          if git diff --staged --quiet; then
            echo "✓ 数据无变化，无需提交"
          else
            git commit -m "chore: 自动同步墨墨单词进度 [skip ci]"
            git push
            echo "✓ 已提交并推送，Pages 将在 1~2 分钟后生效"
          fi
