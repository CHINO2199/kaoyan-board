      todayISO() { return isoOf(new Date(this.now)); },
      examTime() {
        const [y, m, d] = String(this.meta.exam_date || '2026-12-19').split('-').map(Number);
        return new Date(y, (m || 12) - 1, d || 19, 8, 30, 0).getTime();
      },
      dayNo() { return Math.max(0, Math.ceil((this.examTime - this.now) / 86400000)); },
      sprintPct() {
        const total = this.meta.total_days || 100;
        return Math.max(0, Math.min(100, Math.round((total - this.dayNo) / total * 100)));
      },
      todayQuote() {
        const q = (this.meta.quotes || []).concat(DEMO.meta.quotes);
        const idx = Math.abs(diffDays(this.todayISO, '2026-01-01')) % q.length;
        return q[idx];
      },

      subjectNames() {
        const set = new Set(this.meta.subjects || []);
        ['数学', '408', '政治', '英语'].forEach(s => set.add(s));
        this.logs.forEach(l => Object.keys(l.subject_hours || {}).forEach(k => set.add(k)));
        this.notes.forEach(n => n.subject && set.add(n.subject));
        return Array.from(set).filter(s => s !== '综合');
      },
      subjectStats() {
        const sums = {}, days = {};
        this.logs.forEach(l => {
          const sh = l.subject_hours || {};
          Object.keys(sh).forEach(k => {
            sums[k] = (sums[k] || 0) + (Number(sh[k]) || 0);
            if (sh[k] > 0) days[k] = (days[k] || 0) + 1;
          });
        });
        const sumAll = Math.max(0.001, Object.values(sums).reduce((a, b) => a + b, 0));
        return this.subjectNames.map((name, i) => {
          const p = PALETTE[i % PALETTE.length];
          const hours = Math.round((sums[name] || 0) * 10) / 10;
          return {
            name, en: name === '408' ? 'Computer Science' : ({ '数学': 'Mathematics', '政治': 'Politics', '英语': 'English' }[name] || 'Subject'),
            hours, pct: Math.round(hours / sumAll * 100), days: days[name] || 0,
            color: SUBJ_COLOR[name] || p[0], color2: p[1],
            soft: (SUBJ_COLOR[name] || p[0]) + '1f', border: (SUBJ_COLOR[name] || p[0]) + '3d',
            icon: SUBJ_ICON[name] || SUBJ_ICON['408']
          };
        });
      },

      totalHours() { return Math.round(this.logs.reduce((a, l) => a + (Number(l.total_hours) || 0), 0) * 10) / 10; },
      avgHours() { return this.logs.length ? Math.round(this.totalHours / this.logs.length * 10) / 10 : 0; },
      lastLogDate() { return this.logs.length ? this.logs[this.logs.length - 1].date : ''; },
      doneMs() { return this.milestones.filter(m => m.status === 'done').length; },
      ongoingMs() { return this.milestones.filter(m => m.status === 'ongoing' || (m.progress > 0 && m.status !== 'done')).length; },
      pendingMs() { return this.milestones.filter(m => !m.progress && m.status !== 'done').length; },
      streak() {
        if (!this.logs.length) return 0;
        const set = new Set(this.logs.map(l => l.date));
        let n = 0, cur = parseISO(this.todayISO);
        if (!set.has(this.todayISO)) cur = addDays(cur, -1);
        while (set.has(isoOf(cur))) { n++; cur = addDays(cur, -1); }
        return n;
      },

      /* ---- 大日历 ---- */
      days() {
        if (!this.winStart) return [];
        const base = parseISO(this.winStart), arr = [];
        for (let i = 0; i < WIN_DAYS; i++) {
          const d = addDays(base, i), iso = isoOf(d);
          arr.push({ iso, d: d.getDate(), wd: WD[(d.getDay() + 6) % 7].slice(1), we: d.getDay() === 0 || d.getDay() === 6, isToday: iso === this.todayISO });
        }
        return arr;
      },
      monthSpans() {
        const out = [];
        this.days.forEach(d => {
          const key = d.iso.slice(0, 7);
          const last = out[out.length - 1];
          if (last && last.key === key) last.days++;
          else out.push({ key, label: (parseISO(d.iso).getMonth() + 1) + ' 月', days: 1 });
        });
        return out;
      },
      todayOffset() { return this.winStart ? diffDays(this.todayISO, this.winStart) : -1; },

      /* ---- 热力图 ---- */
      heat() {
        const weeks = HEAT_WEEKS;
        const today = parseISO(this.todayISO);
        const dow = (today.getDay() + 6) % 7;
        const endDate = addDays(today, 6 - dow);
        const start = addDays(endDate, -(weeks * 7 - 1));
        const map = {};
        this.logs.forEach(l => { map[l.date] = Number(l.total_hours) || 0; });
        const cols = [], months = [];
        let lastMonth = -1;
        for (let w = 0; w < weeks; w++) {
          const col = [];
          for (let k = 0; k < 7; k++) {
            const d = addDays(start, w * 7 + k), iso = isoOf(d), h = map[iso] || 0;
            const lv = h <= 0 ? 0 : h <= 2 ? 1 : h <= 4.5 ? 2 : h <= 7.5 ? 3 : 4;
            col.push({ iso, h, lv, future: iso > this.todayISO });
          }
          cols.push(col);
          const mo = addDays(start, w * 7).getMonth();
          if (mo !== lastMonth) { months.push({ label: (mo + 1) + '月', len: 1 }); lastMonth = mo; }
          else months[months.length - 1].len++;
        }
        return { cols, months, weeks };
      },

      /* ---- 每日看板 ---- */
      dayLog() { return this.logs.find(l => l.date === this.viewDate) || null; },
      viewWeek() { return this.viewDate ? weekdayOf(this.viewDate) : ''; },
      sortedSubjects() {
        const sh = (this.dayLog && this.dayLog.subject_hours) || {};
        const out = {};
        Object.entries(sh).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => { out[k] = v; });
        return out;
      },

      /* ---- 笔记 ---- */
      filteredNotes() { return this.noteTab === '全部' ? this.notes : this.notesOf(this.noteTab); },
      filteredNotesNewest() {
        return this.filteredNotes.slice().sort((a, b) => (a.uploaded_at < b.uploaded_at ? 1 : -1));
      },
      totalNoteWords() { return this.filteredNotes.reduce((a, n) => a + (n.content || '').length, 0); },
      latestNoteDate() {
        return this.notes.reduce((a, n) => (!a || n.uploaded_at > a) ? n.uploaded_at : a, '');
      }
    },

    watch: {
      page(p) {
        if (p === 'daily') this.scheduleDonut();
        else if (this.donut) { this.donut.dispose(); this.donut = null; }
        if (p === 'home') {
          const self = this;
          this.whenReady(function () { return self.$refs.stage; }, function () { self.startThree(); });
        } else this.destroyThree();
      },
      viewDate() { if (this.page === 'daily') this.scheduleDonut(); },
      theme() { this.$nextTick(() => this.initDonut()); this.refreshThreeTheme(); }
    },

    mounted() {
      /* --- 主题（深色为主，用户切换后记忆） --- */
      const savedTheme = localStorage.getItem(LS_THEME);
      this.theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', this.theme);

      /* --- 时钟 --- */
      this.tick();
      this._clock = setInterval(() => this.tick(), 1000);

      /* --- 演示数据快捷开关 --- */
      const self = this;
      window.__demo = function (on) {
        if (on === false) { self.isDemo = false; self.ready = false; self.gateEmpty = true; self.payload = null; return '已退出示范数据'; }
        self.useDemo(); return '已载入示范数据';
      };

      this.viewDate = this.todayISO;
      this.resetWindow();
      this.loadEnc();
    },

    beforeUnmount() {
      clearInterval(this._clock);
      this.destroyThree();
    },

    methods: {
      /* ---------------- 工具（供模板直接调用） ---------------- */
      p2: function (n) { return p2(n); },
      renderMd: function (src) { return renderMd(src); },
      subjColor: function (n) { return subjColor(n); },
      relDay: function (iso) { return relDay(iso); },

      /* ---------------- 数据加载 ---------------- */
      async loadEnc() {
        this.gateEmpty = false; this.ready = false;
        try {
          const res = await fetch('./data.enc', { cache: 'no-store' });
          if (!res.ok) throw new Error('missing');
          const txt = (await res.text()).trim();
          if (!txt || /^</.test(txt)) throw new Error('missing');   // GitHub Pages 的 404 HTML
          this.encText = txt;

          const cached = this.getCachedKey();
          if (cached) {
            try {
              this.applyPayload(aesDecrypt(txt, cached), cached);
              this.pwd = cached;
              return;
            } catch (e) { this.clearKey(); }
          }
          this.gateEmpty = false;
          this.$nextTick(() => { if (this.$refs.pwdInput) this.$refs.pwdInput.focus(); });
        } catch (e) {
          if (this.forceDemo) { this.useDemo(); return; }
          this.gateEmpty = true;
        }
      },

      reload() { this.loadEnc(); },

      tryUnlock() {
        if (!this.pwd.trim()) { this.fail('请输入主密码'); return; }
        if (!this.encText) { this.loadEnc(); return; }
        this.loading = true;
        this.err = '';
        setTimeout(() => {
          try {
            const k = this.pwd.trim();
            this.applyPayload(aesDecrypt(this.encText, k), k);
            if (this.remember) this.setKey(k);
            else sessionStorage.setItem(LS_KEY, JSON.stringify({ k, t: Date.now(), s: 1 }));
          } catch (e) {
            this.fail('密码不正确，再试一次');
          } finally {
            this.loading = false;
          }
        }, 220);
      },

      fail(msg) {
        this.err = msg;
        this.gateShake = false;
        this.$nextTick(() => {
          this.gateShake = true;
          setTimeout(() => { this.gateShake = false; }, 620);
        });
      },

      applyPayload(obj, key) {
        if (!obj || typeof obj !== 'object') throw new Error('bad payload');
        this.payload = obj;
        this.isDemo = false;
        this.err = '';
        this.ready = true;
        if (key) this._key = key;                 // 后续解密 PDF 需要
        const self = this;
        this.whenReady(function () { return self.$refs.stage; }, function () { self.startThree(); });
        if (this.page === 'daily') this.scheduleDonut();
      },

      useDemo() {
        this.payload = JSON.parse(JSON.stringify(DEMO));
        this.isDemo = true;
        this._key = '';
        this.gateEmpty = false;
        this.ready = true;
        const self = this;
        this.whenReady(function () { return self.$refs.stage; }, function () { self.startThree(); });
      },

      /* ---------------- 密钥缓存 ---------------- */
      setKey(k) { localStorage.setItem(LS_KEY, JSON.stringify({ k, t: Date.now(), s: 0 })); },
      getCachedKey() {
        try {
          const raw = localStorage.getItem(LS_KEY) || sessionStorage.getItem(LS_KEY);
          if (!raw) return '';
          const o = JSON.parse(raw);
          if (!o || !o.k) return '';
          if (!o.s && Date.now() - o.t > 7 * 864e5) { this.clearKey(); return ''; }
          return o.k;
        } catch (e) { return ''; }
      },
      clearKey() { localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY); },

      lock() {
        this.clearKey();
        this.ready = false;
        this.payload = null;
        this.isDemo = false;
        this.pwd = '';
        this.err = '';
        this._key = '';
        this.revokePdfUrl();
        this.activeNote = null;
        this.page = 'home';
        this.destroyThree();
        this.$nextTick(() => { if (this.$refs.pwdInput) this.$refs.pwdInput.focus(); });
      },

      /* ---------------- 主题 ---------------- */
      toggleTheme() {
        this.theme = this.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', this.theme);
        localStorage.setItem(LS_THEME, this.theme);
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', this.theme === 'dark' ? '#0A0610' : '#FCF7FA');
      },

      /* ---------------- 时钟 / 导航 ---------------- */
      tick() {
        this.now = Date.now();
        const s = Math.max(0, Math.floor((this.examTime - this.now) / 1000));
        this.cd = {
          // 与 dayNo 口径一致（向上取整），避免出现"倒数第 100 天却显示 99"
          d: Math.max(0, Math.ceil((this.examTime - this.now) / 86400000)),
          h: Math.floor(s / 3600) % 24,
          m: Math.floor(s / 60) % 60,
          s: s % 60
        };
      },
      go(p) { this.page = p; window.scrollTo({ top: 0, behavior: 'smooth' }); },

      /* ---------------- 甘特 ---------------- */
      resetWindow() {
        this.winStart = isoOf(addDays(parseISO(this.todayISO), -12));
      },
      shiftWindow(dir) {
        this.winStart = isoOf(addDays(parseISO(this.winStart), dir * 30));
      },
      dayIndex(iso) { return this.winStart ? diffDays(iso, this.winStart) : 0; },
      barOf(ms, type) {
        const isPlan = type === 'plan';
        const s = isPlan ? ms.planned_start : ms.actual_start;
        if (!s) return { style: { display: 'none' } };
        const e = isPlan ? (ms.planned_end || s) : (ms.actual_end || this.todayISO);
        let a = this.dayIndex(s), b = this.dayIndex(e);
        if (b < a) b = a;
        const A = Math.max(a, 0), B = Math.min(b, WIN_DAYS - 1);
        if (B < 0 || A > WIN_DAYS - 1) return { style: { display: 'none' } };
        return {
          style: {
            left: (A * DAY_W + 2) + 'px',
            width: Math.max((B - A + 1) * DAY_W - 5, 9) + 'px'
          }
        };
      },
      showTip(ev, ms, type) {
        const rect = ev.currentTarget.getBoundingClientRect();
        const isPlan = type === 'plan';
        const rows = isPlan
          ? [['计划工期', (ms.planned_start || '—') + ' → ' + (ms.planned_end || '—')],
             ['剩余', (ms.planned_end && ms.planned_end >= this.todayISO) ? diffDays(ms.planned_end, this.todayISO) + ' 天' : (ms.planned_end ? '已超期 ' + diffDays(this.todayISO, ms.planned_end) + ' 天' : '—')]]
          : [['实际投入', (ms.actual_start || '—') + ' → ' + (ms.actual_end || '进行中')],
             ['偏差', this.devText(ms)]];
        let html = rows.map(row => '<div><span class="k">' + row[0] + '</span>' + row[1] + '</div>').join('');
        html += '<div style="margin-top:7px;padding-top:7px;border-top:1px solid var(--bd)">'
              + '<span class="k">进度</span>' + (ms.progress || 0) + '%'
              + (ms.note ? '<br><span class="k">备注</span>' + esc(ms.note) : '') + '</div>';
        this.tip = {
          show: true,
          x: Math.max(8, Math.min(rect.left, window.innerWidth - 300)),
          y: rect.bottom + 10,
          title: ms.title,
          html
        };
      },
      devText(ms) {
        if (!ms.actual_start || !ms.planned_start) return '尚未启动';
        const d = diffDays(ms.actual_start, ms.planned_start);
        return d === 0 ? '按计划启动' : (d > 0 ? '晚启动 ' + d + ' 天' : '提前 ' + (-d) + ' 天启动');
      },
      showHeatTip(ev, c) {
        const r = ev.currentTarget.getBoundingClientRect();
        this.tip = {
          show: true, x: Math.min(r.left, window.innerWidth - 260), y: r.bottom + 10,
          title: c.iso, html: c.future ? '<div style="color:var(--tx-3)">尚未到来</div>' : `<div><span class="k">学习</span>${c.h} 小时</div>`
        };
      },
      hideTip() { this.tip.show = false; },

      /* ---------------- 每日看板 ---------------- */
      shiftDay(n) {
        const d = addDays(parseISO(this.viewDate), n);
        const iso = isoOf(d);
        if (iso > this.todayISO) return;
        this.viewDate = iso;
      },
      segDur(seg) {
        if (!seg || !seg.start || !seg.end) return 0;
        const [h1, m1] = seg.start.split(':').map(Number);
        const [h2, m2] = seg.end.split(':').map(Number);
        return Math.max(0, Math.round(((h2 * 60 + m2) - (h1 * 60 + m1)) / 6) / 10);
      },
      pctOf(h) {
        const t = (this.dayLog && Number(this.dayLog.total_hours)) || 0;
        return t ? Math.round(h / t * 100) : 0;
      },
      /** 页面切换有 400ms 过渡动画，需等元素真正挂上 DOM 再初始化图表 / 3D */
      whenReady(getEl, fn, tries) {
        const self = this;
        this.$nextTick(function () {
          if (getEl()) { fn.call(self); return; }
          if ((tries || 0) < 25) setTimeout(function () { self.whenReady(getEl, fn, (tries || 0) + 1); }, 80);
        });
      },
      scheduleDonut() {
        const self = this;
        this.whenReady(function () { return document.getElementById('donut'); }, function () { self.initDonut(); });
      },

      initDonut() {
        const el = document.getElementById('donut');
        if (!el || !window.echarts || !this.dayLog) return;
        if (this.donut) { this.donut.dispose(); this.donut = null; }

        if (!w || !h) return;
        this.donut = echarts.init(el, null, { renderer: 'canvas' });
        const data = Object.entries(this.dayLog.subject_hours || {}).map(([k, v]) => ({
          name: k, value: v, itemStyle: { color: this.subjColor(k) }
        }));
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-2').trim() || '#0D0814';
        this.donut.setOption({
          animationDuration: 1100,
          animationEasing: 'cubicOut',
          tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(20,12,26,.94)',
            borderColor: 'rgba(236,72,153,.35)',
            textStyle: { color: '#F5EDF3', fontSize: 12 },
            formatter: p => `${p.marker} ${p.name}<br/><b>${p.value} h</b> · ${p.percent}%`
          },
          series: [{
            type: 'pie',
            radius: ['63%', '87%'],
            center: ['50%', '50%'],
            avoidLabelOverlap: false,
            padAngle: 1.6,
            itemStyle: { borderRadius: 9, borderColor: bg, borderWidth: 3 },
            label: { show: false },
            labelLine: { show: false },
            emphasis: { scale: true, scaleSize: 9, itemStyle: { shadowBlur: 22, shadowColor: 'rgba(236,72,153,.55)' } },
            data
          }]
        });
        if (!this._donutResize) {
          this._donutResize = () => { if (this.donut) this.donut.resize(); };

      },

      /* ---------------- 笔记 ---------------- */
      notesOf(s) { return this.notes.filter(n => n.subject === s); },
      bookStyle(n, i) {
        const p = PALETTE[(this.subjectNames.indexOf(n.subject) + PALETTE.length) % PALETTE.length] || PALETTE[0];
        const c1 = SUBJ_COLOR[n.subject] || p[0];
        // 书脊高度：按标题长度与序号轻微错落，营造真实书架的参差感
        const h = 196 + ((n.title || '').length % 4) * 22 + (i % 3) * 10;
        return {
          height: h + 'px',
          background: `linear-gradient(165deg, ${c1}, ${p[1]})`
        };
      },
      bookTitle(n) {
        const t = n.title || '未命名';
        return t.length > 11 ? t.slice(0, 11) + '…' : t;
      },
      /* ---------------- 笔记阅读（独立页面） ---------------- */
      openNote(n) {
        this.activeNote = n;
        this.pdfError = '';
        this.pdfLoading = false;
        this.revokePdfUrl();
        this.page = 'reader';
        window.scrollTo({ top: 0, behavior: 'auto' });
        if (n.type === 'pdf') this.loadPdf(n);
      },
      closeReader() {
        this.revokePdfUrl();
        this.pdfError = '';
        this.pdfLoading = false;
        this.page = 'notes';
        window.scrollTo({ top: 0, behavior: 'auto' });
      },

      /* ---------------- PDF：解密为 Blob，交给浏览器内置阅读器 ----------------
         不用 PDF.js：省掉 1MB 依赖与 worker 版本/跨域坑，任何现代浏览器
         （Chrome / Edge / Firefox / Safari，含移动端）都能滚动、缩放、检索。 */
      /** 解密二进制 PDF：格式为 IV(16 字节) + AES-256-CBC 密文 */
      decryptBinary(arrayBuffer) {
        if (!this._key) throw new Error('当前为示范数据，未持有解密密钥。请用主密码解锁后查看该 PDF。');
        const all = new Uint8Array(arrayBuffer);
        if (all.length <= 16) throw new Error('PDF 密文长度异常');
        const dec = CryptoJS.AES.decrypt(
          { ciphertext: u8ToWA(all.slice(16)) },
          deriveKey(this._key),
          { iv: u8ToWA(all.slice(0, 16)), mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const bytes = waToU8(dec);
        if (!bytes.length) throw new Error('PDF 解密失败（密钥不匹配）');
        return bytes;
      },
      async loadPdf(n) {
        this.pdfLoading = true;
        this.pdfError = '';
        this.revokePdfUrl();
        try {
          const res = await fetch(n.enc, { cache: 'no-store' });
          if (!res.ok) throw new Error('找不到加密文件 ' + n.enc + '，请确认已执行 update.py 并推送');
          const bytes = this.decryptBinary(await res.arrayBuffer());
          if (!this.activeNote || this.activeNote.id !== n.id) return;   // 期间用户已切走
          const blob = new Blob([bytes], { type: 'application/pdf' });
          this.pdfUrl = URL.createObjectURL(blob);
          this.pdfLoading = false;
        } catch (e) {
          this.pdfLoading = false;
          this.pdfError = (e && e.message) || '未知错误';
        }
      },
      revokePdfUrl() {
        if (this.pdfUrl) {
          try { URL.revokeObjectURL(this.pdfUrl); } catch (e) { }
          this.pdfUrl = '';
        }
      },

      /* ---------------- Three.js 粒子 ---------------- */
      startThree() {
        if (!window.THREE || this.page !== 'home') return;
        if (this._three) return;
        const canvas = this.$refs.stage;
        if (!canvas) return;
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
        } catch (e) { return; }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 120);
        const group = new THREE.Group();
        scene.add(group);

        const N = window.innerWidth < 760 ? 3600 : 9200;
        const pos = new Float32Array(N * 3);
        const start = new Float32Array(N * 3);
        const target = new Float32Array(N * 3);
        const rand = new Float32Array(N);
        const col = new Float32Array(N * 3);
        const cA = new THREE.Color('#F472B6'), cB = new THREE.Color('#A78BFA'), cC = new THREE.Color('#60A5FA');

        for (let i = 0; i < N; i++) {
          const side = Math.random() < 0.5 ? -1 : 1;
          const u = Math.pow(Math.random(), 0.85);          // 0=书脊 1=页边
          const v = Math.random() * 2 - 1;                  // 沿页面纵向
          const lift = Math.sin(u * Math.PI * 0.62) * 0.62; // 页边向上抬 → 翻开的两页
          const flare = Math.pow(u, 1.35);
          const x = side * u * 1.18 + (Math.random() - 0.5) * 0.02;
          const y = v * (0.98 - 0.62 * flare) + lift + (Math.random() - 0.5) * 0.02;
          const z = Math.sin(u * Math.PI * 0.5) * 0.30 * side - 0.08 + (Math.random() - 0.5) * 0.02;
          target[i * 3] = x; target[i * 3 + 1] = y; target[i * 3 + 2] = z;

          const r = 2.6 + Math.random() * 4.4;
          const th = Math.acos(2 * Math.random() - 1), ph = Math.random() * Math.PI * 2;
          start[i * 3] = r * Math.sin(th) * Math.cos(ph);
          start[i * 3 + 1] = r * Math.sin(th) * Math.sin(ph) * 0.7;
          start[i * 3 + 2] = r * Math.cos(th) * 0.8;

          rand[i] = Math.random();
          const c = cA.clone().lerp(cB, u).lerp(cC, u * u * 0.55);
          const edgeFade = 1 - Math.pow(u, 3) * 0.55;      // 页边渐隐，避免生硬的截断
          col[i * 3] = c.r * edgeFade;
          col[i * 3 + 1] = c.g * edgeFade;
          col[i * 3 + 2] = c.b * edgeFade;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aStart', new THREE.BufferAttribute(start, 3));
        geo.setAttribute('aTarget', new THREE.BufferAttribute(target, 3));
        geo.setAttribute('aRand', new THREE.BufferAttribute(rand, 1));
        geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uProg: { value: 0 },
            uSize: { value: 44 },
            uAlpha: { value: 1 },
            uTint: { value: new THREE.Color(1, 1, 1) }
          },
          vertexShader: `
            attribute vec3 aStart; attribute vec3 aTarget; attribute float aRand; attribute vec3 aColor;
            uniform float uTime; uniform float uProg; uniform float uSize; uniform float uAlpha;
            varying vec3 vC; varying float vA;
            void main(){
              float p = clamp(uProg * 1.25 - aRand * 0.42, 0.0, 1.0);
              p = 1.0 - pow(1.0 - p, 3.0);
              vec3 pos = mix(aStart, aTarget, p);
              float br = 0.006 + aRand * 0.02;
              pos.x += sin(uTime * 0.62 + aRand * 42.0) * br;
              pos.y += cos(uTime * 0.54 + aRand * 33.0) * br;
              pos.z += sin(uTime * 0.44 + aRand * 27.0) * br;
              vec4 mv = modelViewMatrix * vec4(pos, 1.0);
              gl_Position = projectionMatrix * mv;
              gl_PointSize = (1.5 + aRand * 2.2) * uSize / max(-mv.z, 0.001);
              vC = aColor;
              vA = (0.34 + aRand * 0.66) * p * uAlpha;
            }`,
          fragmentShader: `
            uniform vec3 uTint;
            varying vec3 vC; varying float vA;
            void main(){
              vec2 c = gl_PointCoord - 0.5;
              float d = length(c);
              if(d > 0.5) discard;
              float a = smoothstep(0.5, 0.0, d);
              a = a * a * 0.92;                 // 中心不实，保持空灵
              gl_FragColor = vec4(vC * uTint, a * vA);
            }`,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });

        group.add(new THREE.Points(geo, mat));

        const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
        const onMove = e => {
          mouse.tx = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.ty = (e.clientY / window.innerHeight) * 2 - 1;
        };
        window.addEventListener('mousemove', onMove, { passive: true });

        const resize = () => {
          const p = canvas.parentElement;
          const w = (p && p.clientWidth) || window.innerWidth;
          const h = (p && p.clientHeight) || 560;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          const wide = w > 900;
          group.position.set(wide ? 1.20 : 0.10, wide ? -0.10 : 0.42, 0);
          camera.position.z = wide ? 3.9 : 4.8;
          mat.uniforms.uSize.value = wide ? 6 : 5;
          camera.updateProjectionMatrix();
        };
        resize();
        window.addEventListener('resize', resize);

        this._three = { renderer, scene, camera, group, mat, geo, mouse, onMove, resize, t: 0 };
        this.refreshThreeTheme();

        const loop = () => {
          if (!this._three) return;
          this._raf = requestAnimationFrame(loop);
          const T = this._three;
          T.t += 0.016;
          T.mat.uniforms.uTime.value = T.t;
          T.mat.uniforms.uProg.value = Math.min(1, T.mat.uniforms.uProg.value + 0.011);
          T.mouse.x += (T.mouse.tx - T.mouse.x) * 0.05;
          T.mouse.y += (T.mouse.ty - T.mouse.y) * 0.05;
          T.group.rotation.y += (T.mouse.x * 0.34 - T.group.rotation.y) * 0.055;
          T.group.rotation.x += ((T.mouse.y * 0.16 - 0.08) - T.group.rotation.x) * 0.055;
          T.group.position.y += Math.sin(T.t * 0.5) * 0.0006;
          // 整体呼吸感
          T.mat.uniforms.uAlpha.value = (T.baseAlpha || 1) * (1 + Math.sin(T.t * 0.72) * 0.07);
          T.renderer.render(T.scene, T.camera);
        };
        loop();
      },

      /** 完全销毁 Three 上下文（切换页面 / 锁屏时调用，避免 WebGL 上下文泄漏） */
      destroyThree() {
        if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
        const T = this._three;
        if (!T) return;
        window.removeEventListener('mousemove', T.onMove);
        window.removeEventListener('resize', T.resize);
        try { T.geo.dispose(); T.mat.dispose(); T.renderer.dispose(); } catch (e) { }
        this._three = null;
      },

      /** 深浅主题下粒子混合方式与色调自适应 */
      refreshThreeTheme() {
        const T = this._three;
        if (!T) return;
        const dark = this.theme === 'dark';
        T.mat.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending;
        T.baseAlpha = dark ? 1 : 0.42;
        T.mat.uniforms.uAlpha.value = T.baseAlpha;
        // 深色底用加法混合提亮；浅色底改用正常混合并把粒子调成柔和粉紫
        const tint = dark ? [1, 1, 1] : [0.95, 0.66, 0.84];
        T.mat.uniforms.uTint.value.setRGB(tint[0], tint[1], tint[2]);
        T.mat.needsUpdate = true;
      }
    }
  });

  /* ---------------- 全局工具函数（函数声明提升，供 methods 引用） ---------------- */
  function subjColor(name) {
    if (SUBJ_COLOR[name]) return SUBJ_COLOR[name];
    const idx = ['数学', '408', '政治', '英语'].indexOf(name);
    return PALETTE[(idx < 0 ? 0 : idx) % PALETTE.length][0];
  }
  function relDay(iso) {
    const d = diffDays(iso, isoOf(new Date()));
    if (d === 0) return '今天';
    if (d === -1) return '昨天';
    if (d === -2) return '前天';
    if (d === 1) return '明天';
    return d < 0 ? Math.abs(d) + ' 天前' : d + ' 天后';
  }

  const vm = app.mount('#app');
  window.__vm = vm;

  /* 暴露一个只读的调试入口 */
  console.log('%c 百日研途 ', 'background:#EC4899;color:#fff;padding:3px 10px;border-radius:6px;font-weight:700',
    '控制台可用：__demo(true) 载入示范数据 · __demo(false) 退出 · __vm 访问状态');
}

/* ---------------- 启动：等待依赖就绪 ----------------
   若 CDN 全部不可用，给出明确提示而不是一片空白。 */
(function () {
  function go() {
    if (!window.Vue) {
      var el = document.getElementById('app');
      if (el) {
        el.removeAttribute('v-cloak');
        el.innerHTML =
          '<div style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;'
          + 'font-family:system-ui,-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif">'
          + '<div><div style="font-size:32px;margin-bottom:16px">📡</div>'
          + '<div style="font-size:18px;font-weight:700;color:#F7EFF5;margin-bottom:10px">依赖库加载失败</div>'
          + '<div style="font-size:13px;line-height:1.95;color:#B3A2B1">'
          + '页面需要 Vue / ECharts / CryptoJS / Three.js，但它们都没能从 CDN 下载成功。<br>'
          + '请检查网络后刷新页面，或参考 README 把依赖改为本地托管。</div></div></div>';
      }
      return;
    }
    bootApp();
  }
  if (window.__LIBS_READY__ && window.__LIBS_READY__.then) window.__LIBS_READY__.then(go);
  else go();
})();
</script>
