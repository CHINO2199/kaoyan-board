/* 每个库按顺序尝试多个 CDN，任一成功即停；单源 6 秒超时自动切下一个。
   国内网络下 jsdelivr 偶有不稳，故备选 npmmirror（阿里源）与 bootcdn。 */
window.__LIBS_READY__ = (function () {
  var SETS = [
    ['Vue', function () { return typeof Vue !== 'undefined'; },
      'https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js',

      'https://registry.npmmirror.com/echarts/5.5.1/files/dist/echarts.min.js',
      'https://cdn.bootcdn.net/ajax/libs/echarts/5.5.1/echarts.min.js',
      'https://unpkg.com/echarts@5.5.1/dist/echarts.min.js'],
    ['CryptoJS', function () { return typeof CryptoJS !== 'undefined'; },
      'https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js',
      'https://registry.npmmirror.com/crypto-js/4.2.0/files/crypto-js.min.js',
      'https://cdn.bootcdn.net/ajax/libs/crypto-js/4.2.0/crypto-js.min.js',
      'https://unpkg.com/crypto-js@4.2.0/crypto-js.min.js'],
    ['THREE', function () { return typeof THREE !== 'undefined'; },
      'https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.min.js',
      'https://registry.npmmirror.com/three/0.156.1/files/build/three.min.js',
      'https://cdn.bootcdn.net/ajax/libs/three.js/0.156.1/three.min.js',
      'https://unpkg.com/three@0.156.1/build/three.min.js']
  ];

  function loadOne(url, timeout) {
    return new Promise(function (resolve) {
      var s = document.createElement('script'), done = false;
      var timer = setTimeout(function () { if (!done) { done = true; s.remove(); resolve(false); } }, timeout);
      s.src = url; s.async = true;
      s.onload = function () { if (done) return; done = true; clearTimeout(timer); resolve(true); };
      s.onerror = function () { if (done) return; done = true; clearTimeout(timer); s.remove(); resolve(false); };
      document.head.appendChild(s);
    });
  }

  function loadSet(check, urls) {
    if (check()) return Promise.resolve(true);
    var p = Promise.resolve(false);
    urls.forEach(function (u) {
      p = p.then(function (ok) {
        if (ok || check()) return true;
        return loadOne(u, 6000).then(function () { return check(); });
      });
    });
    return p;
  }

  var jobs = SETS.map(function (set) { return loadSet(set[1], set.slice(2)); });
  return Promise.all(jobs).then(function (results) {
    var missing = results.map(function (ok, i) { return ok ? null : SETS[i][0]; }).filter(Boolean);
    if (missing.length) console.warn('[百日研途] 依赖加载失败：' + missing.join(', ') + '，对应模块将降级');
    return missing;

/* ==========================================================================

   ========================================================================== */

/* ==========================================================================
   2. 基础排版与画布
   ========================================================================== */
body{
  font-family:var(--font);
  background:var(--bg); color:var(--tx);
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;

}

    radial-gradient(58rem 40rem at 10% -12%, var(--glow-1), transparent 62%),
    radial-gradient(48rem 34rem at 94% 2%,  var(--glow-2), transparent 60%),
    radial-gradient(46rem 32rem at 46% 112%, var(--glow-1), transparent 62%);

}

/* ==========================================================================
   3. 通用组件：卡片 / 按钮 / 标签
   ========================================================================== */
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 22px}

.card{
  position:relative; border-radius:var(--r-lg);
  background:var(--glass); border:1px solid var(--bd);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:var(--shadow-sm);
  transition:transform .5s var(--ease-out), border-color .4s, box-shadow .5s, background .4s;
}
.card.hoverable:hover{transform:translateY(-3px);border-color:var(--bd-2);box-shadow:var(--shadow)}
.card-pad{padding:22px 24px}
/* 卡片顶部高光边 */
.card::after{
  content:''; position:absolute; inset:0 0 auto 0; height:1px; border-radius:var(--r-lg) var(--r-lg) 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  opacity:0; transition:opacity .5s;
}
html[data-theme="dark"] .card:hover::after{opacity:1}

.card-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.01em}
.card-title .dot{width:7px;height:7px;border-radius:50%;background:var(--pink-500);box-shadow:0 0 12px var(--pink-400)}
.card-sub{font-size:12px;color:var(--tx-3);line-height:1.7}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 18px}
.sec-title{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sec-desc{font-size:12.5px;color:var(--tx-3);margin-top:5px;letter-spacing:.01em}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:650;
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:transform .38s var(--ease-out), box-shadow .38s, background .35s, border-color .35s, color .35s;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,var(--pink-500),var(--pink-400) 55%,var(--violet));
  color:#fff;box-shadow:0 12px 30px -12px rgba(236,72,153,.8);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 42px -14px rgba(236,72,153,.95)}

.btn-sm{padding:7px 13px;font-size:12px}
.btn-icon{padding:9px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);color:var(--tx-2)}
.btn-icon:hover{color:var(--tx);border-color:var(--bd-2);background:var(--glass-2)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none!important}

.tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;

}

  display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;
  font-size:12px;font-weight:600;color:var(--tx-2);
  border:1px solid var(--bd);background:var(--glass);
  backdrop-filter:blur(14px);
}
/* 呼吸灯小圆点 */
.breath{width:8px;height:8px;border-radius:50%;background:var(--pink-500);position:relative}
.breath::after{
  content:'';position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--pink-400);
  animation:breathe 2.6s var(--ease) infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(.7);opacity:.85}
  50%{transform:scale(1.5);opacity:0}
}
.breath-static{width:6px;height:6px;border-radius:50%;background:var(--pink-500)}

/* 进度条 */
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.bar > i{
  display:block;height:100%;border-radius:99px;position:relative;
  background:linear-gradient(90deg,var(--pink-500),var(--pink-400));
  transition:width 1.1s var(--ease-out);
}
.bar > i::after{
  content:'';position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%);animation:shine 2.6s var(--ease) infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(200%)}}
.bar.violet > i{background:linear-gradient(90deg,var(--violet-d),var(--violet))}
.bar.blue   > i{background:linear-gradient(90deg,var(--blue-d),var(--blue))}
.bar.teal   > i{background:linear-gradient(90deg,#0D9488,var(--teal))}
.bar.amber  > i{background:linear-gradient(90deg,#D97706,var(--amber))}

/* ==========================================================================
   4. 翻滚数字与过渡动画
   ========================================================================== */
@keyframes digitIn{
  0%{transform:translateY(58%) scale(.9);opacity:0;filter:blur(7px)}
  60%{filter:blur(0)}
  100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}
}
.digit{display:inline-block;animation:digitIn .62s var(--ease-out) both}

@keyframes riseIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
.rise{animation:riseIn .8s var(--ease-out) both}

.fade-enter-active,.fade-leave-active{transition:opacity .4s var(--ease), transform .4s var(--ease)}
.fade-enter-from{opacity:0;transform:translateY(16px) scale(.995)}
.fade-leave-to{opacity:0;transform:translateY(-10px) scale(.995)}

.slide-enter-active,.slide-leave-active{transition:transform .55s var(--ease-out), opacity .45s var(--ease)}
.slide-enter-from,.slide-leave-to{transform:translateX(102%);opacity:0}

/* ==========================================================================

.nav{
  position:sticky;top:0;z-index:60;
  background:var(--nav-bg);
  backdrop-filter:blur(22px) saturate(180%);

.nav-in{max-width:var(--maxw);margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:20px}

.brand-mark{

.brand-txt b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.15}

.subjects{position:relative;z-index:2;max-width:var(--maxw);margin:56px auto 0;padding:0 22px 34px}
.subj-stage{position:relative;padding:16px 0 8px}
.subj-svg{position:absolute;left:0;right:0;top:0;width:100%;height:100%;z-index:0;overflow:visible;pointer-events:none}
.subj-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end}
.subj{
  position:relative;padding:20px 18px 18px;border-radius:var(--r-lg);cursor:pointer;text-align:left;
  border:1px solid var(--bd);background:var(--glass);
  backdrop-filter:blur(18px) saturate(150%);
  transition:transform .55s var(--ease-out), border-color .45s, box-shadow .55s, background .45s;
}
.subj:nth-child(1){transform:translateY(26px)}
.subj:nth-child(2){transform:translateY(10px)}
.subj:nth-child(3){transform:translateY(10px)}
.subj:nth-child(4){transform:translateY(26px)}
.subj.on{border-color:var(--bd-2);background:var(--glass-2);box-shadow:var(--shadow)}
.subj.on:nth-child(1){transform:translateY(14px)}
.subj.on:nth-child(2){transform:translateY(0) scale(1.03)}
.subj.on:nth-child(3){transform:translateY(0) scale(1.03)}
.subj.on:nth-child(4){transform:translateY(14px)}
.subj-ic{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;
  border:1px solid var(--bd);transition:transform .55s var(--ease-out)
}
.subj:hover .subj-ic{transform:translateY(-3px) rotate(-6deg)}
.subj-ic svg{width:20px;height:20px}
.subj h3{font-size:16.5px;margin-bottom:5px}
.subj .en{font-size:10.5px;letter-spacing:.13em;color:var(--tx-3);text-transform:uppercase;margin-bottom:13px}
.subj-meta{display:flex;align-items:baseline;gap:5px;margin-bottom:9px}
.subj-meta b{font-size:23px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.subj-meta span{font-size:11.5px;color:var(--tx-3)}
.subj-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:11.5px;color:var(--tx-3)}

.subj-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:26px}
.arrow{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--bd);background:var(--glass);color:var(--tx-2);
  transition:all .38s var(--ease-out);
}
.arrow:hover{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--pink-500),var(--violet));transform:scale(1.08)}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--bd-2);transition:all .4s var(--ease-out);cursor:pointer}
.dots i.on{width:20px;border-radius:99px;background:linear-gradient(90deg,var(--pink-500),var(--violet))}

/* ==========================================================================
   7. 通用网格布局
   ========================================================================== */
.page{padding:32px 0 60px;animation:riseIn .7s var(--ease-out) both}
.g{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2u{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2v{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.span-2{grid-column:span 2}

/* 统计卡 */
.stat{position:relative;overflow:hidden}
.stat .lbl{font-size:12px;color:var(--tx-3);display:flex;align-items:center;gap:7px;margin-bottom:12px}
.stat .val{font-size:30px;font-weight:820;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.stat .val small{font-size:14px;font-weight:600;color:var(--tx-3);margin-left:3px;letter-spacing:0}
.stat .foot{margin-top:12px;font-size:11.5px;color:var(--tx-3);display:flex;align-items:center;gap:6px}
.stat-ic{
  position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:11px;
  display:grid;place-items:center;border:1px solid var(--bd);background:var(--glass-2);
}
.stat-ic svg{width:16px;height:16px}

/* ==========================================================================
   8. 大日历 · 甘特（预计紫 / 实际蓝）
   ========================================================================== */
.gantt-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;align-items:center;gap:15px;font-size:11.5px;color:var(--tx-3)}
.legend b{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.lg-plan{width:20px;height:9px;border-radius:3px;border:1.5px dashed var(--violet);background:rgba(167,139,250,.2)}
.lg-real{width:20px;height:9px;border-radius:3px;background:linear-gradient(90deg,var(--blue-d),var(--blue))}
.lg-today{width:2px;height:12px;border-radius:2px;background:var(--pink-500);box-shadow:0 0 8px var(--pink-400)}

.gantt-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:6px;position:relative}
.gantt{min-width:max-content;position:relative}

/* 日期标尺 */
.gt-head{position:sticky;top:0;z-index:5;display:flex;background:var(--glass-2);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.gt-corner{
  position:sticky;left:0;z-index:6;flex:0 0 208px;width:208px;
  display:flex;align-items:flex-end;padding:0 14px 10px;font-size:11px;color:var(--tx-3);
  background:var(--glass-2);backdrop-filter:blur(16px);border-right:1px solid var(--bd);letter-spacing:.06em;
}
.gt-scale{position:relative}
.gt-months{display:flex;height:24px;align-items:center}
.gt-month{
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  color:var(--tx-2);border-right:1px solid var(--bd);letter-spacing:.04em;white-space:nowrap;
}
.gt-month i{font-style:normal;color:var(--tx-3);font-weight:500;margin-left:6px;font-size:10px}
.gt-days{display:flex;height:30px;border-top:1px solid var(--bd)}
.gt-day{
  width:36px;flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;border-right:1px solid var(--grid);font-size:10.5px;color:var(--tx-3);
}
.gt-day .d{font-size:12px;font-weight:600;color:var(--tx-2);font-variant-numeric:tabular-nums}
.gt-day.weekend{background:var(--glass)}
.gt-day.today{background:rgba(236,72,153,.16)}
.gt-day.today .d{color:var(--pink-500);font-weight:800}

/* 任务行 */
.gt-row{display:flex;border-bottom:1px solid var(--grid);position:relative;height:62px;transition:background .3s}
.gt-row:hover{background:var(--glass)}
.gt-row:last-child{border-bottom:none}
.gt-name{
  position:sticky;left:0;z-index:4;flex:0 0 208px;width:208px;
  padding:9px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  background:var(--glass-2);backdrop-filter:blur(16px);border-right:1px solid var(--bd);
}
.gt-name .t{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.gt-name .s{font-size:10.5px;color:var(--tx-3);display:flex;align-items:center;gap:7px}
.gt-track{position:relative;display:flex}
.gt-cell{width:36px;flex:0 0 36px;border-right:1px solid var(--grid)}
.gt-cell.weekend{background:var(--glass)}
.gt-today-line{
  position:absolute;top:0;bottom:0;width:2px;border-radius:2px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--pink-500) 18%,var(--pink-500) 82%,transparent);
  box-shadow:0 0 14px rgba(236,72,153,.85);
}
.gt-bar{
  position:absolute;border-radius:7px;cursor:pointer;
  transition:transform .3s var(--ease-out), box-shadow .3s, opacity .3s;
}
.gt-bar:hover{transform:translateY(-1px) scaleY(1.18);z-index:5;box-shadow:var(--shadow-sm)}
.gt-plan{
  top:10px;height:22px;
  border:1.5px dashed rgba(167,139,250,.85);
  background:linear-gradient(90deg,rgba(167,139,250,.24),rgba(167,139,250,.12));
  overflow:hidden;display:flex;align-items:center;padding:0 9px;
}
.gt-plan .fill{
  position:absolute;left:0;top:0;bottom:0;border-radius:5px;
  background:linear-gradient(90deg,rgba(139,92,246,.42),rgba(167,139,250,.26));
  transition:width 1.2s var(--ease-out);
}
.gt-plan .lbl{
  position:relative;z-index:1;font-size:10.5px;font-weight:650;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.35);
}
html[data-theme="light"] .gt-plan .lbl{text-shadow:none}
.gt-real{
  top:37px;height:11px;border-radius:6px;
  background:linear-gradient(90deg,var(--blue-d),var(--blue));
  box-shadow:0 4px 14px -5px rgba(59,130,246,.9);
}
.gt-real.pending{
  background:repeating-linear-gradient(45deg,var(--bd-2),var(--bd-2) 5px,transparent 5px,transparent 10px);
  border:1px dashed var(--bd-2);box-shadow:none;
}
.gt-real .cap{
  position:absolute;right:-3px;top:50%;width:2px;height:15px;transform:translateY(-50%);
  border-radius:2px;background:#fff;opacity:.85;
}
.gt-tip{
  position:fixed;z-index:99;pointer-events:none;padding:12px 14px;border-radius:13px;max-width:280px;
  background:var(--bg-3);border:1px solid var(--bd-2);box-shadow:var(--shadow);
  font-size:11.5px;line-height:1.75;color:var(--tx-2);
  backdrop-filter:blur(18px);
}
.gt-tip b{display:block;font-size:13px;color:var(--tx);margin-bottom:6px}
.gt-tip .k{color:var(--tx-3);display:inline-block;min-width:52px}

/* ==========================================================================
   9. 热力图
   ========================================================================== */
.heat{display:flex;gap:4px;overflow-x:auto;padding:4px 0 6px}
.heat-col{display:flex;flex-direction:column;gap:4px}
.heat-c{
  width:13px;height:13px;border-radius:3.5px;background:var(--track);
  transition:transform .3s var(--ease-out), background .4s;
}
.heat-c:hover{transform:scale(1.42);z-index:2}
.heat-c.l1{background:rgba(244,114,182,.28)}
.heat-c.l2{background:rgba(236,72,153,.5)}
.heat-c.l3{background:rgba(219,39,119,.78)}
.heat-c.l4{background:linear-gradient(135deg,var(--pink-500),var(--violet-d));box-shadow:0 0 10px rgba(236,72,153,.55)}
.heat-c.future{opacity:.28}
.heat-axis{display:flex;gap:4px;font-size:9.5px;color:var(--tx-3);margin-top:6px}

/* ==========================================================================
   10. 每日看板
   ========================================================================== */
.day-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.day-title{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.day-week{font-size:12px;color:var(--tx-3);margin-top:4px;letter-spacing:.05em}
input[type="date"]{
  font-family:inherit;font-size:12.5px;padding:8px 11px;border-radius:11px;
  border:1px solid var(--bd);background:var(--glass-2);color:var(--tx);outline:none;
  transition:border-color .3s;
}
input[type="date"]:hover{border-color:var(--pink-400)}
::-webkit-calendar-picker-indicator{filter:invert(.55);cursor:pointer}
html[data-theme="light"] ::-webkit-calendar-picker-indicator{filter:none}

.donut-wrap{position:relative;height:296px;width:100%}
#donut{width:100%;height:100%}
.donut-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.donut-center b{display:block;font-size:34px;font-weight:830;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.donut-center b small{font-size:15px;color:var(--tx-3);font-weight:600;margin-left:2px}
.donut-center span{display:block;font-size:10.5px;color:var(--tx-3);letter-spacing:.2em;margin-top:7px}

.subj-legend{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sl-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
.sl-row .sw{width:10px;height:10px;border-radius:3.5px;flex:0 0 10px}
.sl-row .nm{flex:1;color:var(--tx-2)}
.sl-row .hr{font-weight:700;font-variant-numeric:tabular-nums}
.sl-row .pc{width:44px;text-align:right;color:var(--tx-3);font-size:11.5px;font-variant-numeric:tabular-nums}

/* 分时段时间轴 */
.tl{position:relative;padding-left:24px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--pink-400),var(--violet),transparent)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:'';position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2.5px solid var(--pink-400);transition:all .35s;
}
.tl-item:hover::before{border-color:var(--violet);box-shadow:0 0 12px rgba(167,139,250,.9);transform:scale(1.2)}
.tl-time{font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums;letter-spacing:.05em;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.tl-body{font-size:13px;line-height:1.7;color:var(--tx-2)}
.tl-body b{color:var(--tx);font-weight:650}
.tl-dur{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--glass-2);border:1px solid var(--bd);color:var(--tx-3)}

/* 任务清单 */
.ck{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:13px;transition:background .3s;border:1px solid transparent}
.ck:hover{background:var(--glass);border-color:var(--bd)}
.ck .box{
  width:19px;height:19px;border-radius:6.5px;flex:0 0 19px;display:grid;place-items:center;margin-top:1px;
  background:linear-gradient(135deg,var(--pink-500),var(--violet));
  box-shadow:0 4px 12px -4px rgba(236,72,153,.8);
}
.ck .box svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;fill:none}
.ck .tx{font-size:13px;line-height:1.65;color:var(--tx-2)}
.ck.done .tx{color:var(--tx-3)}

.lp{display:flex;align-items:flex-start;gap:10px;padding:10px 0;font-size:13px;line-height:1.7;color:var(--tx-2)}
.lp .idx{
  flex:0 0 21px;width:21px;height:21px;border-radius:7px;display:grid;place-items:center;
  font-size:10.5px;font-weight:750;color:var(--pink-500);
  background:var(--glass-2);border:1px solid var(--bd);margin-top:1px;
}

/* 复盘 markdown 区 */
.md{font-size:13.5px;line-height:1.92;color:var(--tx-2)}
.md h1,.md h2,.md h3,.md h4{color:var(--tx);margin:16px 0 8px;line-height:1.45}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:14.5px}.md h4{font-size:13.5px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin:4px 0}
.md li::marker{color:var(--pink-400)}
.md strong{color:var(--tx);font-weight:700}
.md em{font-style:normal;color:var(--pink-500);font-weight:600}
.md code{
  font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:6px;
  background:var(--glass-2);border:1px solid var(--bd);color:var(--pink-500);
}
.md pre{
  background:var(--bg-3);border:1px solid var(--bd);border-radius:13px;padding:14px 16px;
  overflow-x:auto;margin:0 0 12px;font-size:12.5px;line-height:1.75;
}
.md pre code{background:none;border:none;padding:0;color:var(--tx-2)}
.md blockquote{
  margin:0 0 12px;padding:10px 16px;border-left:3px solid var(--pink-400);
  background:var(--glass);border-radius:0 12px 12px 0;color:var(--tx-2);
}
.md hr{border:none;border-top:1px solid var(--bd);margin:18px 0}
.md a{border-bottom:1px solid rgba(236,72,153,.4)}
.md a:hover{border-bottom-color:var(--pink-500)}

/* ==========================================================================
   11. 笔记书架
   ========================================================================== */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--tx-2);
  border:1px solid var(--bd);background:var(--glass);transition:all .38s var(--ease-out);
  display:inline-flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--tx);border-color:var(--bd-2);transform:translateY(-1.5px)}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--pink-500),var(--violet));box-shadow:0 10px 24px -11px rgba(236,72,153,.9)}
.tab .n{font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}

.shelf{position:relative;padding:6px 14px 0;margin-top:10px}
.shelf-lane{position:relative;display:flex;align-items:flex-end;gap:9px;min-height:322px;padding:26px 14px 0;overflow-x:auto;overflow-y:hidden}
.shelf-board{
  height:13px;border-radius:0 0 7px 7px;position:relative;
  background:linear-gradient(180deg,var(--pink-200),var(--pink-300));
  box-shadow:0 12px 26px -12px rgba(190,60,120,.5);
}
html[data-theme="dark"] .shelf-board{background:linear-gradient(180deg,#4A2038,#2E1224)}
.shelf-board::before{
  content:'';position:absolute;inset:0 0 auto 0;height:3px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
}
.shelf-board::after{
  content:'';position:absolute;left:0;right:0;top:-9px;height:9px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.22));
}
.book{
  position:relative;flex:0 0 auto;width:56px;border-radius:8px 8px 3px 3px;cursor:pointer;
  padding:0;overflow:hidden;
  transition:transform .5s var(--ease-out), box-shadow .5s, filter .4s;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14);
}
.book::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:8px 0 0 3px;
  background:linear-gradient(90deg,rgba(0,0,0,.34),transparent);
}
.book::before{
  content:'';position:absolute;left:7px;right:0;top:0;height:3px;border-radius:8px 8px 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42));
}
/* 书脊标题：中文竖排正立；绝对定位脱离 flex，避免被压成多列 */
.book .spine{
  position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:11.5px;font-weight:650;color:#fff;letter-spacing:.09em;
  white-space:nowrap;
  text-shadow:0 1px 5px rgba(0,0,0,.4);
}
.book .date{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  writing-mode:vertical-rl;font-size:9px;color:rgba(255,255,255,.7);letter-spacing:.05em;
  font-variant-numeric:tabular-nums;max-height:120px;overflow:hidden;
}
.book .pdf-tag{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:8px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.94);
  padding:1.5px 4px;border-radius:4px;background:rgba(0,0,0,.3);
  backdrop-filter:blur(4px);
}
.book:hover{transform:translateY(-16px) rotate(-1.2deg);filter:brightness(1.1);z-index:4;
  box-shadow:0 26px 44px -16px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.3)}
.book.on{transform:translateY(-22px) rotate(-2deg);filter:brightness(1.14);z-index:5}
.book-holder{display:flex;align-items:flex-end;gap:4px}
.book-end{width:14px;height:34px;border-radius:3px;background:linear-gradient(180deg,var(--glass-2),var(--glass));border:1px solid var(--bd);flex:0 0 14px;align-self:flex-end}
.shelf-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:220px;color:var(--tx-3);font-size:12.5px;width:100%;
}

/* 笔记阅读页（独立页面，支持 Markdown 与 PDF） */
.reader{max-width:960px;margin:0 auto;padding:0 22px}
.reader-bar{
  position:sticky;top:var(--nav-h,57px);z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 0;
  background:rgba(var(--bg-rgb),.86);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-bottom:1px solid var(--bd);
}
.reader-title{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.reader-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.reader-body{padding:26px 0 70px}
.reader-paper{
  background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-lg);
  padding:clamp(22px,4vw,44px) clamp(20px,4.5vw,52px);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
}
.reader .md{font-size:14.5px;line-height:2.05}
.reader .md h1{font-size:22px;margin-top:4px}
.reader .md h2{font-size:18px;margin-top:26px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.reader .md h3{font-size:16px}
.reader .md li{margin:7px 0}
.reader .md ol,.reader .md ul{padding-left:24px}

/* PDF 阅读器（浏览器内置 viewer） */
.pdf-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pdf-tools a{text-decoration:none}
.pdf-frame{
  display:block;width:100%;
  height:calc(100vh - var(--nav-h,57px) - 168px);
  min-height:540px;
  border:1px solid var(--bd);border-radius:var(--r-lg);
  background:#fff;
  box-shadow:var(--shadow);
  animation:riseIn .5s var(--ease-out) both;
}
.pdf-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:70px 24px;text-align:center;color:var(--tx-3);font-size:13px;line-height:1.9;
  border:1px dashed var(--bd-2);border-radius:var(--r-lg);background:var(--glass);
}
.pdf-state .big{font-size:15px;font-weight:650;color:var(--tx-2)}
.pdf-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;
  font-size:10px;font-weight:750;letter-spacing:.08em;color:#fff;
  background:linear-gradient(135deg,#F43F5E,#EC4899);
}

/* ==========================================================================
   12. 解锁门
   ========================================================================== */
.gate{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;
  background:radial-gradient(60rem 40rem at 50% 30%,rgba(236,72,153,.13),transparent 65%),var(--bg);
  backdrop-filter:blur(3px);
}
.gate-card{
  width:min(94vw,430px);padding:34px 32px 30px;border-radius:var(--r-xl);text-align:center;
  background:var(--glass);border:1px solid var(--bd-2);
  backdrop-filter:blur(28px) saturate(170%);
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.gate-card::before{
  content:'';position:absolute;inset:-40% -40% auto;height:80%;
  background:radial-gradient(closest-side,rgba(236,72,153,.24),transparent 70%);
  pointer-events:none;
}
.gate-lock{
  width:60px;height:60px;margin:0 auto 20px;border-radius:19px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--pink-500),var(--violet));
  box-shadow:0 18px 40px -16px rgba(236,72,153,.95);
  position:relative;
}
.gate-lock svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9}
.gate h2{font-size:21px;margin-bottom:9px}
.gate p{font-size:12.5px;color:var(--tx-3);line-height:1.8;margin-bottom:24px}
.pwd-wrap{position:relative;margin-bottom:13px}
.pwd-wrap input{
  width:100%;padding:14px 46px 14px 16px;border-radius:14px;font-family:var(--mono);font-size:14px;
  letter-spacing:.14em;background:var(--glass-2);border:1px solid var(--bd);color:var(--tx);outline:none;
  transition:border-color .3s, box-shadow .3s;
}
.pwd-wrap input:focus{border-color:var(--pink-400);box-shadow:0 0 0 4px rgba(236,72,153,.14)}
.pwd-wrap .eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  padding:7px;border-radius:9px;color:var(--tx-3);
}
.pwd-wrap .eye:hover{color:var(--tx);background:var(--glass)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}
  40%,60%{transform:translateX(8px)}
}
.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97) both}
.gate-err{font-size:12px;color:var(--rose);min-height:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.gate-foot{margin-top:20px;font-size:11px;color:var(--tx-3);display:flex;align-items:center;justify-content:center;gap:8px}
.chk-line{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tx-2);justify-content:center;margin-bottom:16px;cursor:pointer}
.chk-box{
  width:17px;height:17px;border-radius:5.5px;border:1.5px solid var(--bd-2);display:grid;place-items:center;
  transition:all .3s;flex:0 0 17px;
}
.chk-line.on .chk-box{background:linear-gradient(135deg,var(--pink-500),var(--violet));border-color:transparent}
.chk-box svg{width:10px;height:10px;stroke:#fff;stroke-width:3.6;fill:none;opacity:0;transition:opacity .25s}
.chk-line.on .chk-box svg{opacity:1}

/* 骨架 / 空状态 */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:64px 24px;text-align:center;
}
.empty-ic{
  width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
  border:1px dashed var(--bd-2);background:var(--glass);
}
.empty-ic svg{width:26px;height:26px;stroke:var(--tx-3);fill:none;stroke-width:1.6}
.spin{
  width:22px;height:22px;border-radius:50%;border:2.5px solid var(--bd-2);border-top-color:var(--pink-500);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 页脚 */
.foot{
  position:relative;z-index:1;border-top:1px solid var(--bd);margin-top:20px;
  padding:26px 22px;text-align:center;font-size:11.5px;color:var(--tx-3);line-height:1.9;
}
.foot b{color:var(--tx-2)}
.foot .heart{color:var(--pink-500)}

/* ==========================================================================
   13. 响应式
   ========================================================================== */
@media (max-width:1080px){
  .g-4{grid-template-columns:repeat(2,1fr)}
  .g-2u,.g-2v{grid-template-columns:1fr}
  .subj-grid{grid-template-columns:repeat(2,1fr)}
  .subj:nth-child(n){transform:none}
  .subj.on:nth-child(n){transform:translateY(-4px) scale(1.02)}
}
@media (max-width:760px){
  :root{--nav-h:99px}
  .wrap,.hero-in,.subjects{padding-left:16px;padding-right:16px}
  .nav-in{padding:10px 16px;gap:10px}
  .nav-links{display:none}
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .span-2{grid-column:auto}
  .gt-corner,.gt-name{flex-basis:148px;width:148px}
  .card-pad{padding:18px}
  .hero{padding-top:8px}
  .hero-in{padding-top:24px}
  .cd{gap:12px}
  .subjects{margin-top:34px}
  .reader{padding:0 16px}
  .reader-title{font-size:15.5px}
  .shelf-lane{min-height:322px;padding-left:6px;padding-right:6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<div id="app" v-cloak>

  <!-- ==================================================================
       解锁门 Encryption Gate
       ================================================================== -->
  <Transition name="fade">
    <div class="gate" v-if="!ready">
      <div class="gate-card" :class="{shake:gateShake}" v-if="!gateEmpty">
        <div class="gate-lock">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.6"/>
            <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>
            <circle cx="12" cy="15.6" r="1.25" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <h2>数据已加密</h2>
        <p>输入主密码解锁你的冲刺看板<br>密钥仅存于本机浏览器，不会上传</p>

        <form @submit.prevent="tryUnlock">
          <div class="pwd-wrap">
            <input :type="showPwd?'text':'password'" v-model="pwd" placeholder="MASTER PASSWORD"
                   autocomplete="current-password" spellcheck="false" ref="pwdInput">
            <button type="button" class="eye" @click="showPwd=!showPwd" tabindex="-1">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <path v-if="!showPwd" d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle v-if="!showPwd" cx="12" cy="12" r="2.6"/>
                <path v-if="showPwd" d="M3 3l18 18M10.6 10.7a2.6 2.6 0 0 0 3.6 3.6M6.4 6.6C3.8 8.3 2 12 2 12s3.6 6.5 10 6.5c2.2 0 4-.6 5.5-1.5M9.9 5.7A11 11 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a18 18 0 0 1-3.4 4.2"/>
              </svg>
            </button>
          </div>
          <div class="gate-err">
            <span v-if="err">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-2px;margin-right:5px">
                <circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.4v.2"/>
              </svg>{{ err }}
            </span>
          </div>
          <div class="chk-line" :class="{on:remember}" @click="remember=!remember">
            <span class="chk-box"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></span>
            记住密钥 <span style="color:var(--tx-3)">（7 天内免输入）</span>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:13px" :disabled="loading">
            <span v-if="loading" class="spin" style="width:15px;height:15px;border-width:2px"></span>
            <span v-else>解锁看板</span>
          </button>
        </form>

        <div class="gate-foot">
          <span class="breath-static"></span> AES-256-CBC · 本地解密 · 零上传
        </div>
      </div>

      <!-- 空状态：data.enc 缺失 -->
      <div class="gate-card" v-else style="text-align:left">
        <div class="empty-ic" style="margin:0 auto 18px;border-style:solid">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2.4h5.5A2.5 2.5 0 0 1 20 9.9v7.6A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"/>
          </svg>
        </div>
        <h2 style="text-align:center">还没有数据文件</h2>
        <p style="text-align:center;margin-bottom:22px">
          未在站点根目录找到 <code style="font-family:var(--mono);color:var(--pink-500)">data.enc</code><br>
          你可以先浏览示范数据，或按 README 生成真实加密文件。
        </p>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-primary" style="width:100%;padding:12px" @click="useDemo">
            进入示范数据预览
          </button>
          <button class="btn btn-ghost" style="width:100%;padding:12px" @click="reload">
            重新检测 data.enc
          </button>
        </div>
        <div class="gate-foot" style="margin-top:22px">
          提示：控制台执行 <code style="font-family:var(--mono)">__demo(false)</code> 可关闭示范数据
        </div>
      </div>
    </div>
  </Transition>

  <!-- ==================================================================
       主界面
       ================================================================== -->
  <template v-if="ready">

    <!-- 顶栏 -->
    <header class="nav">
      <div class="nav-in">
        <div class="brand" @click="go('home')">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 18V7l7 6 7-6v11"/>
            </svg>
          </div>
          <div class="brand-txt">
            <b>百日研途</b>
            <span>Kaoyan Sprint</span>
          </div>
        </div>

        <nav class="nav-links">
          <button v-for="n in navs" :key="n.k" class="nav-link" :class="{active:page===n.k}" @click="go(n.k)">
            {{ n.t }}
          </button>
        </nav>

        <div class="nav-right">
          <span class="tag" v-if="isDemo" style="border-color:var(--amber);color:var(--amber)">示范数据</span>
          <button class="btn-icon" @click="toggleTheme" :title="theme==='dark'?'切换浅色':'切换深色'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <template v-if="theme==='dark'">
                <circle cx="12" cy="12" r="4.2"/>
                <path d="M12 2.6v2.2M12 19.2v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
              </template>
              <path v-else d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9z"/>
            </svg>
          </button>
          <button class="btn-icon" @click="lock" title="锁定看板">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"/>
            </svg>
          </button>
          <div class="tgl" @click="toggleTheme" style="display:none"></div>
        </div>
      </div>
      <!-- 移动端分页导航 -->
      <div class="nav-sub">
        <button v-for="n in navs" :key="'m'+n.k" :class="{on:page===n.k}" @click="go(n.k)">{{ n.t }}</button>
      </div>
    </header>

    <main class="wrap">
      <Transition name="fade" mode="out-in">

        <!-- ============================================================
             首页
             ============================================================ -->
        <section v-if="page==='home'" key="home" class="hero">
          <canvas id="stage3d" ref="stage"></canvas>
          <div class="hero-grad"></div>

          <div class="hero-in">
            <div class="hero-eyebrow">
              <span class="pill">
                <span class="breath"></span>
                距 {{ meta.exam_title || '考研' }}· 第 <b class="num" style="color:var(--pink-500)">{{ dayNo }}</b> 天
              </span>
            </div>

            <h1 class="hero-title">百日<em>研途</em></h1>
            <div class="hero-sub">系统知识 · 优质资源 · 研途相伴</div>
            <p class="hero-desc">{{ todayQuote }}</p>

            <div class="cd">
              <div class="cd-cell">
                <span class="halo"></span>
                <span class="cd-num num" :key="'d'+cd.d">{{ cd.d }}</span>
                <span class="cd-lb">DAYS</span>
              </div>
              <span class="cd-sep">:</span>
              <div class="cd-cell"><span class="cd-num num" :key="'h'+cd.h">{{ p2(cd.h) }}</span><span class="cd-lb">HOURS</span></div>
              <span class="cd-sep">:</span>
              <div class="cd-cell"><span class="cd-num num" :key="'m'+cd.m">{{ p2(cd.m) }}</span><span class="cd-lb">MINUTES</span></div>
              <span class="cd-sep">:</span>
              <div class="cd-cell"><span class="cd-num num" :key="'s'+cd.s">{{ p2(cd.s) }}</span><span class="cd-lb">SECONDS</span></div>
            </div>

            <div class="hero-actions">
              <button class="btn btn-primary" @click="go('dash')">
                进入工作台
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12.5 5.8l6.2 6.2-6.2 6.2"/></svg>
              </button>
              <button class="btn btn-ghost" @click="go('daily')">查看今日记录</button>
            </div>

            <!-- 学科卡片 -->
            <div class="subjects" style="padding-left:0;padding-right:0">
              <div class="subj-stage">
                <svg class="subj-svg" viewBox="0 0 1200 230" preserveAspectRatio="none">
                  <defs>
                    <linearGradient id="arcG" x1="0" y1="0" x2="1" y2="0">
                      <stop offset="0%" stop-color="#F472B6" stop-opacity=".06"/>
                      <stop offset="28%" stop-color="#EC4899" stop-opacity=".55"/>
                      <stop offset="62%" stop-color="#A78BFA" stop-opacity=".5"/>
                      <stop offset="100%" stop-color="#60A5FA" stop-opacity=".06"/>
                    </linearGradient>
                  </defs>
                  <path d="M-20 186 C 120 186 150 66 300 66 C 420 66 430 150 540 150 C 660 150 660 46 800 46 C 930 46 960 158 1080 158 C 1140 158 1180 130 1220 108"
                        fill="none" stroke="url(#arcG)" stroke-width="1.6" stroke-linecap="round"/>
                  <circle v-for="(s,i) in subjectStats" :key="'nd'+i"
                          :cx="[144,438,732,1026][i]" :cy="[150,86,86,150][i]"
                          :r="activeSubj===i?5:3.2"
                          :fill="activeSubj===i?s.color:'var(--tx-3)'"
                          :opacity="activeSubj===i?1:.45"/>
                </svg>

                <div class="subj-grid">
                  <button v-for="(s,i) in subjectStats" :key="s.name"
                          class="subj" :class="{on:activeSubj===i}"
                          @mouseenter="activeSubj=i" @click="activeSubj=i">
                    <div class="subj-ic" :style="{background:s.soft,borderColor:s.border}">
                      <span v-html="s.icon" :style="{color:s.color,display:'block',lineHeight:0}"></span>
                    </div>
                    <h3>{{ s.name }}</h3>
                    <div class="en">{{ s.en }}</div>
                    <div class="subj-meta"><b class="num">{{ s.hours }}</b><span>h 累计</span></div>
                    <div class="bar" :style="{'--c':s.color}"><i :style="{width:s.pct+'%',background:`linear-gradient(90deg,${s.color},${s.color2})`}"></i></div>
                    <div class="subj-foot">
                      <span>{{ s.days }} 天有记录</span>
                      <span>{{ s.pct }}%</span>
                    </div>
                  </button>
                </div>
              </div>

              <div class="subj-nav">
                <button class="arrow" @click="activeSubj=(activeSubj+3)%4">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.8L8.8 12l6.2 6.2"/></svg>
                </button>
                <div class="dots"><i v-for="(s,i) in subjectStats" :key="'d'+i" :class="{on:activeSubj===i}" @click="activeSubj=i"></i></div>
                <button class="arrow" @click="activeSubj=(activeSubj+1)%4">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.8L15.2 12 9 18.2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- ============================================================
             工作内容总览
             ============================================================ -->
        <section v-else-if="page==='dash'" key="dash" class="page">
          <div class="sec-head">
            <div>
              <div class="sec-title">工作内容总览</div>
              <div class="sec-desc">全周期计划 · 实际执行对比 · 学习强度分布</div>
            </div>
            <div class="legend">
              <b><i class="lg-plan"></i>预计工期</b>
              <b><i class="lg-real"></i>实际完成</b>
              <b><i class="lg-today"></i>今天</b>
            </div>
          </div>

          <!-- 统计卡 -->
          <div class="g g-4" style="margin-bottom:16px">
            <div class="card card-pad hoverable">
              <div class="lbl">距离考试</div>
              <div class="val num">{{ dayNo }}<small>天</small></div>
              <div class="foot"><span class="breath-static"></span>{{ meta.exam_date }} · {{ meta.exam_title }}</div>
              <div class="stat-ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--pink-500)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.4V12l3.2 2"/></svg>
              </div>
            </div>

            <div class="card card-pad hoverable">
              <div class="lbl">累计学习</div>
              <div class="val num">{{ totalHours }}<small>h</small></div>
              <div class="foot">日均 <b class="num" style="color:var(--tx-2)">{{ avgHours }}h</b> · 共 {{ logs.length }} 天记录</div>
              <div class="stat-ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5.5A1.5 1.5 0 0 1 5.5 4H10v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M14 19V9h4.5A1.5 1.5 0 0 1 20 10.5V19h-6z"/></svg>
              </div>
            </div>

            <div class="card card-pad hoverable">
              <div class="lbl">里程碑完成</div>
              <div class="val num">{{ doneMs }}<small>/ {{ milestones.length }}</small></div>
              <div class="foot">进行中 <b class="num" style="color:var(--tx-2)">{{ ongoingMs }}</b> 项 · 待启动 {{ pendingMs }} 项</div>
              <div class="stat-ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.6v16.8M6 4.4h11.5l-2.6 4 2.6 4H6"/></svg>
              </div>
            </div>

            <div class="card card-pad hoverable">
              <div class="lbl">连续打卡</div>
              <div class="val num">{{ streak }}<small>天</small></div>
              <div class="foot">最近记录 {{ lastLogDate || '—' }}</div>
              <div class="stat-ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5.5 4 5.5 9a5.5 5.5 0 0 1-11 0c0-1.6.7-3 1.6-4.2"/><path d="M12 20a2.6 2.6 0 0 0 2.6-2.6c0-1.7-2.6-4-2.6-4s-2.6 2.3-2.6 4A2.6 2.6 0 0 0 12 20z"/></svg>
              </div>
            </div>
          </div>

          <!-- 冲刺总进度 -->
          <div class="card card-pad" style="margin-bottom:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap">
              <div class="card-title"><span class="dot"></span>冲刺总进度</div>
              <div class="card-sub">
                已走过 <b class="num" style="color:var(--pink-500)">{{ sprintPct }}%</b>
                · 剩余 {{ dayNo }} 天 · 参考终点 {{ meta.exam_date }}
              </div>
            </div>
            <div class="bar" style="height:11px"><i :style="{width:sprintPct+'%'}"></i></div>
            <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--tx-3)">
              <span>{{ meta.start_date }} 启程</span>
              <span>考场</span>
            </div>
          </div>

          <!-- 大日历甘特 -->
          <div class="card" style="padding:22px 24px 18px;margin-bottom:16px">
            <div class="sec-head" style="margin-bottom:14px">
              <div>
                <div class="card-title"><span class="dot"></span>标准工作日历</div>
                <div class="card-sub" style="margin-top:6px">
                  紫色虚线为计划工期，蓝色实心为实际投入 · 悬停查看明细
                </div>
              </div>
              <div class="gantt-tools">
                <button class="btn btn-ghost btn-sm" @click="shiftWindow(-1)">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5.8L8.8 12l6.2 6.2"/></svg>上一月
                </button>
                <button class="btn btn-ghost btn-sm" @click="resetWindow">回到今天</button>
                <button class="btn btn-ghost btn-sm" @click="shiftWindow(1)">下一月
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5.8L15.2 12 9 18.2"/></svg>
                </button>
              </div>
            </div>

            <div class="gantt-scroll">
              <div class="gantt">
                <!-- 标尺 -->
                <div class="gt-head">
                  <div class="gt-corner">任务 / 里程碑</div>
                  <div class="gt-scale">
                    <div class="gt-months">
                      <div v-for="m in monthSpans" :key="m.key" class="gt-month" :style="{width:(m.days*36)+'px'}">
                        {{ m.label }}<i>{{ m.days }} 天</i>
                      </div>
                    </div>
                    <div class="gt-days">
                      <div v-for="d in days" :key="d.iso" class="gt-day"
                           :class="{weekend:d.we, today:d.isToday}">
                        <span>{{ d.we ? d.wd : '' }}</span>
                        <span class="d">{{ d.d }}</span>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 任务行 -->
                <div v-for="ms in milestones" :key="ms.id" class="gt-row">
                  <div class="gt-name">
                    <div class="t" :title="ms.title">
                      <span class="breath-static" :style="{background:subjColor(ms.subject)}"></span>
                      {{ ms.title }}
                    </div>
                    <div class="s">
                      <span>{{ ms.subject }}</span>
                      <span>·</span>
                      <span v-if="ms.status==='done'">已完成</span>
                      <span v-else-if="ms.progress>0">进行中 {{ ms.progress }}%</span>
                      <span v-else>未启动</span>
                    </div>
                  </div>

                  <div class="gt-track">
                    <div v-for="d in days" :key="ms.id+d.iso" class="gt-cell" :class="{weekend:d.we}"></div>

                    <!-- 今天竖线 -->
                    <div v-if="todayOffset>=0" class="gt-today-line" :style="{left:(todayOffset*36)+'px'}"></div>

                    <!-- 预计工期（紫） -->
                    <div v-if="barOf(ms,'plan')" class="gt-bar gt-plan"
                         :style="barOf(ms,'plan').style"
                         @mouseenter="showTip($event, ms, 'plan')" @mouseleave="hideTip">
                      <span class="fill" :style="{width:ms.progress+'%'}"></span>
                      <span class="lbl">{{ ms.title }}</span>
                    </div>

                    <!-- 实际完成（蓝） -->
                    <div class="gt-bar gt-real" :class="{pending:!ms.actual_start}"
                         :style="barOf(ms,'real').style"
                         @mouseenter="showTip($event, ms, 'real')" @mouseleave="hideTip">
                      <span v-if="ms.actual_end" class="cap"></span>
                    </div>
                  </div>
                </div>

                <div v-if="!milestones.length" class="empty">
                  <div class="empty-ic">
                    <svg viewBox="0 0 24 24" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.8h17M8 3.4v3.2M16 3.4v3.2"/></svg>
                  </div>
                  <div>还没有里程碑数据</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 热力图 + 四科累计 -->
          <div class="g g-2u">
            <div class="card card-pad">
              <div class="sec-head" style="margin-bottom:12px">
                <div class="card-title"><span class="dot"></span>学习强度热力图</div>
                <div class="card-sub">近 {{ heat.weeks }} 周 · 越亮越投入</div>
              </div>
              <div class="heat">
                <div v-for="(col,ci) in heat.cols" :key="'hc'+ci" class="heat-col">
                  <div v-for="c in col" :key="c.iso" class="heat-c"
                       :class="[c.lv?('l'+c.lv):'', c.future?'future':'']"
                       :title="c.iso + ' · ' + c.h + 'h'" @mouseenter="showHeatTip($event,c)" @mouseleave="hideTip"></div>
                </div>
              </div>
              <div class="heat-axis">
                <span v-for="(m,mi) in heat.months" :key="'hm'+mi" :style="{width:(m.len*(13+4))+'px'}">{{ m.label }}</span>
              </div>
              <div style="display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:12px;font-size:10.5px;color:var(--tx-3)">
                <span>少</span>
                <i class="heat-c" style="display:block"></i>
                <i class="heat-c l1" style="display:block"></i>
                <i class="heat-c l2" style="display:block"></i>
                <i class="heat-c l3" style="display:block"></i>
                <i class="heat-c l4" style="display:block"></i>
                <span>多</span>
              </div>
            </div>

            <div class="card card-pad">
              <div class="sec-head" style="margin-bottom:14px">
                <div class="card-title"><span class="dot"></span>学科投入分布</div>
                <div class="card-sub">全周期累计</div>
              </div>
              <div style="display:flex;flex-direction:column;gap:16px">
                <div v-for="s in subjectStats" :key="'ss'+s.name">
                  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
                    <span style="font-size:13px;font-weight:650">{{ s.name }}</span>
                    <span style="font-size:12px;color:var(--tx-3)">
                      <b class="num" style="color:var(--tx);font-size:13.5px">{{ s.hours }}</b>h · {{ s.pct }}%
                    </span>
                  </div>
                  <div class="bar"><i :style="{width:s.pct+'%',background:`linear-gradient(90deg,${s.color},${s.color2})`}"></i></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ============================================================
             每日看板
             ============================================================ -->
        <section v-else-if="page==='daily'" key="daily" class="page">
          <div class="card card-pad" style="margin-bottom:16px">
            <div class="day-nav">
              <button class="btn-icon" @click="shiftDay(-1)" title="前一天">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.8L8.8 12l6.2 6.2"/></svg>
              </button>
              <div style="flex:1;min-width:180px">
                <div class="day-title num">{{ viewDate }}</div>
                <div class="day-week">{{ viewWeek }} · {{ viewDate === todayISO ? '今天' : relDay(viewDate) }}</div>
              </div>
              <input type="date" v-model="viewDate" :max="todayISO">
              <button class="btn btn-ghost btn-sm" @click="viewDate=todayISO" v-if="viewDate!==todayISO">回到今天</button>
              <button class="btn-icon" @click="shiftDay(1)" title="后一天" :disabled="viewDate>=todayISO">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.8L15.2 12 9 18.2"/></svg>
              </button>
            </div>

            <div class="g g-4" style="margin-top:20px" v-if="dayLog">
              <div><div class="lbl" style="font-size:11.5px;color:var(--tx-3);margin-bottom:7px">当日总时长</div>
                <div class="val num" style="font-size:24px">{{ dayLog.total_hours }}<small>h</small></div></div>
              <div><div class="lbl" style="font-size:11.5px;color:var(--tx-3);margin-bottom:7px">涉及科目</div>
                <div class="val num" style="font-size:24px">{{ Object.keys(dayLog.subject_hours||{}).length }}<small>科</small></div></div>
              <div><div class="lbl" style="font-size:11.5px;color:var(--tx-3);margin-bottom:7px">完成任务</div>
                <div class="val num" style="font-size:24px">{{ (dayLog.completed_tasks||[]).length }}<small>项</small></div></div>
              <div><div class="lbl" style="font-size:11.5px;color:var(--tx-3);margin-bottom:7px">时段记录</div>
                <div class="val num" style="font-size:24px">{{ (dayLog.time_segments||[]).length }}<small>段</small></div></div>
            </div>
          </div>

          <template v-if="dayLog">
            <div class="g g-2u" style="margin-bottom:16px">
              <div class="card card-pad">
                <div class="sec-head" style="margin-bottom:6px">
                  <div class="card-title"><span class="dot"></span>各科时长占比</div>
                  <div class="card-sub">{{ viewDate }}</div>
                </div>
                <div class="donut-wrap">
                  <div id="donut"></div>
                  <div class="donut-center">
                    <b class="num">{{ dayLog.total_hours }}<small>h</small></b>
                    <span>今日总时长</span>
                  </div>
                </div>
                <div class="subj-legend">
                  <div v-for="(h,name) in sortedSubjects" :key="'lg-'+name" class="sl-row">
                    <span class="sw" :style="{background:subjColor(name)}"></span>
                    <span class="nm">{{ name }}</span>
                    <span class="hr">{{ h }}h</span>
                    <span class="pc">{{ pctOf(h) }}%</span>
                  </div>
                </div>
              </div>

              <div class="card card-pad">
                <div class="sec-head" style="margin-bottom:16px">
                  <div class="card-title"><span class="dot"></span>分时段学习内容</div>
                  <div class="card-sub">{{ (dayLog.time_segments||[]).length }} 个时段</div>
                </div>
                <div class="tl" v-if="(dayLog.time_segments||[]).length">
                  <div v-for="(seg,i) in dayLog.time_segments" :key="'seg'+i" class="tl-item">
                    <div class="tl-time">
                      {{ seg.start }} – {{ seg.end }}
                      <span class="tl-dur">{{ segDur(seg) }}h</span>
                    </div>
                    <div class="tl-body">
                      <b :style="{color:subjColor(seg.subject)}">【{{ seg.subject }}】</b>{{ seg.content }}
                    </div>
                  </div>
                </div>
                <div v-else class="card-sub" style="padding:26px 0;text-align:center">这天还没有分时段记录</div>
              </div>
            </div>

            <div class="g g-2" style="margin-bottom:16px">
              <div class="card card-pad">
                <div class="sec-head" style="margin-bottom:10px">
                  <div class="card-title"><span class="dot"></span>已完成任务</div>
                  <div class="tag">{{ (dayLog.completed_tasks||[]).length }} 项</div>
                </div>
                <div v-if="(dayLog.completed_tasks||[]).length">
                  <div v-for="(t,i) in dayLog.completed_tasks" :key="'ct'+i" class="ck done">
                    <span class="box"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></span>
                    <span class="tx">{{ t }}</span>
                  </div>
                </div>
                <div v-else class="card-sub" style="padding:22px 0;text-align:center">暂无已完成任务</div>
              </div>

              <div class="card card-pad">
                <div class="sec-head" style="margin-bottom:10px">
                  <div class="card-title"><span class="dot"></span>明日核心计划</div>
                </div>
                <div v-if="(dayLog.tomorrow_plan||[]).length">
                  <div v-for="(t,i) in dayLog.tomorrow_plan" :key="'tp'+i" class="lp">
                    <span class="idx num">{{ p2(i+1) }}</span>
                    <span class="tx">{{ t }}</span>
                  </div>
                </div>
                <div v-else class="card-sub" style="padding:22px 0;text-align:center">明天还没有排计划</div>
              </div>
            </div>

            <div class="card card-pad">
              <div class="sec-head" style="margin-bottom:16px">
                <div class="card-title"><span class="dot"></span>今日复盘 · 心得与卡点</div>
                <div class="card-sub">Markdown 渲染</div>
              </div>
              <div class="md" v-html="renderMd(dayLog.reflection)"></div>
              <div v-if="!dayLog.reflection" class="card-sub" style="padding:12px 0">这天还没有写复盘</div>
            </div>
          </template>

          <div v-else class="card empty" style="padding:70px 24px">
            <div class="empty-ic">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h14a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M3.5 10h17M8 3.2v3.4M16 3.2v3.4"/></svg>
            </div>
            <div style="font-size:14px;font-weight:650">{{ viewDate }} 没有学习记录</div>
            <div class="card-sub" style="max-width:330px">点击上方日期切换器回看其他日期，或在当天结束时把总结交给 Agent，会自动写入这份看板。</div>
            <div style="display:flex;gap:9px;margin-top:6px">
              <button class="btn btn-ghost btn-sm" @click="shiftDay(-1)">看前一天</button>
              <button class="btn btn-primary btn-sm" @click="viewDate=lastLogDate||todayISO" v-if="lastLogDate">跳到最近记录</button>
            </div>
          </div>
        </section>

        <!-- ============================================================
             笔记书架
             ============================================================ -->
        <section v-else-if="page==='notes'" key="notes" class="page">
          <div class="sec-head">
            <div>
              <div class="sec-title">笔记书架</div>
              <div class="sec-desc">按学科归类 · 点击书脊翻开阅读 · 记录每份笔记的上传日期</div>
            </div>
            <div class="tabs">
              <button class="tab" :class="{on:noteTab==='全部'}" @click="noteTab='全部'">
                全部<span class="n">{{ notes.length }}</span>
              </button>
              <button v-for="s in subjectNames" :key="'nt'+s" class="tab" :class="{on:noteTab===s}" @click="noteTab=s">
                {{ s }}<span class="n">{{ notesOf(s).length }}</span>
              </button>
            </div>
          </div>

          <div class="card" style="padding:20px 22px 26px">
            <div class="shelf">
              <div class="shelf-lane">
                <div v-if="!filteredNotes.length" class="shelf-empty">
                  <div class="empty-ic">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M11 4h4.5A1.5 1.5 0 0 1 17 5.5v14.5h-6z"/><path d="M19 6.4l1.6 12.9"/></svg>
                  </div>
                  <div>这一层还空着 —— 把 Markdown 笔记交给 Agent 就能上架</div>
                </div>

                <div v-for="(n,i) in filteredNotes" :key="n.id" class="book-holder">
                  <div class="book"
                       :class="{on:activeNote&&activeNote.id===n.id}"
                       :style="bookStyle(n,i)"
                       @click="openNote(n)"
                       :title="n.title + ' · ' + n.uploaded_at">
                    <span class="pdf-tag" v-if="n.type==='pdf'">PDF</span>
                    <span class="spine">{{ bookTitle(n) }}</span>
                    <span class="date">{{ n.uploaded_at }}</span>
                  </div>
                </div>
                <div class="book-end" v-if="filteredNotes.length"></div>
              </div>
              <div class="shelf-board"></div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;flex-wrap:wrap">
              <div class="card-sub">
                共 <b style="color:var(--tx-2)">{{ filteredNotes.length }}</b> 份笔记 ·
                累计 <b style="color:var(--tx-2)" class="num">{{ totalNoteWords }}</b> 字 ·
                最近更新 {{ latestNoteDate || '—' }}
              </div>
              <div class="card-sub">笔记源文件放在 <code style="font-family:var(--mono);color:var(--pink-500)">notes_src/</code>，由脚本转成加密数据</div>
            </div>
          </div>

          <!-- 上传时间线 -->
          <div class="card card-pad" style="margin-top:16px">
            <div class="sec-head" style="margin-bottom:14px">
              <div class="card-title"><span class="dot"></span>上传记录</div>
              <div class="card-sub">按时间倒序</div>
            </div>
            <div class="tl" v-if="filteredNotes.length">
              <div v-for="n in filteredNotesNewest" :key="'tl'+n.id" class="tl-item">
                <div class="tl-time">
                  {{ n.uploaded_at }}
                  <span class="tl-dur" :style="{color:subjColor(n.subject)}">{{ n.subject }}</span>
                </div>
                <div class="tl-body">
                  <b>{{ n.title }}</b>
                  <span style="color:var(--tx-3);font-size:12px;margin-left:8px">{{ (n.tags||[]).join(' · ') }}</span>
                  <button style="margin-left:10px;color:var(--pink-500);font-size:12px;font-weight:600" @click="openNote(n)">阅读 →</button>
                </div>
              </div>
            </div>
            <div v-else class="card-sub" style="padding:16px 0">暂无记录</div>
          </div>
        </section>

        <!-- ============================================================
             笔记阅读页（Markdown / PDF 通用）
             ============================================================ -->
        <section v-else-if="page==='reader' && activeNote" key="reader" class="page" style="padding-top:0">
          <div class="reader">
            <div class="reader-bar">
              <button class="btn btn-ghost btn-sm" @click="closeReader">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.8L8.8 12l6.2 6.2"/></svg>
                返回书架
              </button>
              <div style="flex:1;min-width:150px">
                <div class="reader-title">{{ activeNote.title }}</div>
                <div class="reader-meta">
                  <span class="tag" :style="{borderColor:subjColor(activeNote.subject)+'66',color:subjColor(activeNote.subject)}">{{ activeNote.subject }}</span>
                  <span class="tag">{{ activeNote.uploaded_at }}</span>
                  <span class="pdf-badge" v-if="activeNote.type==='pdf'">PDF</span>
                  <span class="tag" v-for="t in (activeNote.tags||[])" :key="t">{{ t }}</span>
                </div>
              </div>
              <div class="pdf-tools" v-if="activeNote.type==='pdf' && pdfUrl">
                <a class="btn btn-ghost btn-sm" :href="pdfUrl" target="_blank" rel="noopener">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5"/></svg>
                  新窗口
                </a>
                <a class="btn btn-ghost btn-sm" :href="pdfUrl" :download="(activeNote.title||'note')+'.pdf'">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 19.5h15"/></svg>
                  下载
                </a>
              </div>
            </div>

            <div class="reader-body">
              <!-- Markdown 笔记 -->
              <div v-if="activeNote.type!=='pdf'" class="reader-paper">
                <div class="md" v-html="renderMd(activeNote.content)"></div>
                <div v-if="!activeNote.content" class="card-sub" style="padding:24px 0;text-align:center">这份笔记还没有正文</div>
              </div>

              <!-- PDF 笔记 -->
              <template v-else>
                <div v-if="pdfLoading" class="pdf-state">
                  <span class="spin"></span>
                  <span>正在解密 PDF…</span>
                </div>
                <div v-else-if="pdfError" class="pdf-state">
                  <div class="empty-ic" style="border-style:solid">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h7L18 8.5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M13 4v5h5"/></svg>
                  </div>
                  <div class="big">PDF 无法显示</div>
                  <div>{{ pdfError }}</div>
                </div>
                <iframe v-else class="pdf-frame" :src="pdfUrl" title="PDF 阅读"></iframe>
              </template>
            </div>
          </div>
        </section>

      </Transition>

  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function isoOf(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
  function addDays(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); }

  /* ---- CryptoJS WordArray <-> Uint8Array ---- */
  function u8ToWA(u8) {
    const w = [];
    for (let i = 0; i < u8.length; i++) w[i >>> 2] = (w[i >>> 2] || 0) | (u8[i] << (24 - (i % 4) * 8));
    return CryptoJS.lib.WordArray.create(w, u8.length);
  }
  function waToU8(wa) {
    const u8 = new Uint8Array(wa.sigBytes);
    for (let i = 0; i < wa.sigBytes; i++) u8[i] = (wa.words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
    return u8;
  }
  /** 主密码 -> 32 字节 AES 密钥（字节级 ljust(32)[:32]，与 Python 完全一致） */
  function deriveKey(pwd) {
    const src = waToU8(CryptoJS.enc.Utf8.parse(pwd));
    const key = new Uint8Array(32).fill(PAD_BYTE);
    for (let i = 0; i < Math.min(32, src.length); i++) key[i] = src[i];
    return u8ToWA(key);
  }
  /** 解密 base64(IV[16] + AES-256-CBC 密文) -> 解析后的对象 */
  function aesDecrypt(b64, pwd) {
    const all = waToU8(CryptoJS.enc.Base64.parse(String(b64).replace(/\s+/g, '')));
    if (all.length <= 16) throw new Error('数据格式不正确');
    const dec = CryptoJS.AES.decrypt(
      { ciphertext: u8ToWA(all.slice(16)) },
      deriveKey(pwd),
      { iv: u8ToWA(all.slice(0, 16)), mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
    );
    const txt = dec.toString(CryptoJS.enc.Utf8);
    if (!txt) throw new Error('密码不正确');
    try {
      return JSON.parse(txt);              // 密码错误时这里是乱码，JSON.parse 会失败
    } catch (e) {
      throw new Error('密码不正确');
    }
  }

  /* ---- 极简 Markdown 渲染（标题/列表/引用/代码/强调/链接） ---- */
  function renderMd(src) {
    if (src == null || src === '') return '';
    let s = String(src).replace(/\r\n?/g, '\n');
    const codes = [];
    s = s.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });

    const inline = t => {
      let x = esc(t);
      x = x.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      x = x.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      x = x.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      x = x.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      x = x.replace(/\\([\\`*_{}\[\]()#+\-.!])/g, '$1');
      return x;
    };

    const out = [];
    let buf = [], list = null, quote = [];
    const flushP = () => { if (buf.length) { out.push('<p>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</p>'); buf = []; } };
    const flushL = () => { if (list) { out.push('<' + list.type + '>' + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + '</' + list.type + '>'); list = null; } };
    const flushQ = () => { if (quote.length) { out.push('<blockquote>' + inline(quote.join('\n')).replace(/\n/g, '<br>') + '</blockquote>'); quote = []; } };
    const flushAll = () => { flushP(); flushL(); flushQ(); };

    for (const raw of s.split('\n')) {
      const line = raw.replace(/\s+$/, '');
      const cm = line.match(/^\u0001(\d+)\u0001$/);
      if (cm) { flushAll(); out.push('<pre><code>' + esc(codes[+cm[1]]) + '</code></pre>'); continue; }
      if (!line.trim()) { flushAll(); continue; }
      let m;
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushAll(); const lv = m[1].length; out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) { flushAll(); out.push('<hr>'); continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushP(); flushL(); quote.push(m[1]); continue; }
      if ((m = line.match(/^[-*+]\s+(.*)$/))) { flushP(); flushQ(); if (!list || list.type !== 'ul') { flushL(); list = { type: 'ul', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^\d+[.)]\s+(.*)$/))) { flushP(); flushQ(); if (!list || list.type !== 'ol') { flushL(); list = { type: 'ol', items: [] }; } list.items.push(m[1]); continue; }
      flushL(); flushQ(); buf.push(line);
    }
    flushAll();
    return out.join('');
  }
